<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Семейное древо — Хроники Экосистемы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0b0718; /* Глубокий бархатный аметистовый ночной фон */
  --bg-panel: rgba(21, 14, 44, 0.75); /* Полупрозрачное матовое стекло */
  --accent-1: #b55ffc; /* Аметистовая орхидея */
  --accent-2: #ec4899; /* Розовый неон для пар */
  --accent-3: #475569;
  --text-main: #fcfaff;
  --text-muted: #9f93ba;
  --border-inner: rgba(181, 95, 252, 0.35);
  --border-outer: rgba(255, 255, 255, 0.03);
  --glow: 0 0 35px rgba(181, 95, 252, 0.2);
  --glow-partner: 0 0 35px rgba(236, 72, 153, 0.55);
  --line-grad: linear-gradient(to bottom, transparent, rgba(181, 95, 252, 0.3), transparent);
  --card-radius: 16px;
  --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
/* Стили для полной заморозки эффектов на слабом ПК или телефоне */
body.perf-mode {
  --glow: none !important;
  --glow-partner: none !important;
  --transition-smooth: none !important;
}
body.perf-mode .blob {
  display: none !important;
}
body.perf-mode .bg-canvas {
  animation: none !important;
  opacity: 0.3 !important;
}
body.perf-mode .sidebar, 
body.perf-mode .sidebar-secondary, 
body.perf-mode .group, 
body.perf-mode .center-card, 
body.perf-mode .search-input,
body.perf-mode .analytics-widget,
body.perf-mode .guestbook-section {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  background: #150e2c !important;
}
body.perf-mode .person:hover {
  transform: none !important;
}
body.perf-mode .center-card:hover, 
body.perf-mode .group:hover {
  transform: none !important;
  box-shadow: none !important;
  border-color: var(--border-inner) !important;
}
body.perf-mode .modal-avatar {
  animation: none !important;
}

* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  -webkit-tap-highlight-color: transparent; 
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg-dark);
  background-attachment: fixed;
  overflow-x: hidden;
  position: relative;
}

/* Новая технологичная неоновая сетка из лазерных линий */
.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: -2;
  background-color: var(--bg-dark);
  background-image: 
    linear-gradient(rgba(181, 95, 252, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(181, 95, 252, 0.05) 1px, transparent 1px);
  background-size: 60px 60px;
  background-position: center center;
  pointer-events: none;
  animation: gridPulse 12s infinite alternate ease-in-out;
}

@keyframes gridPulse {
  0% { opacity: 0.7; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.01); }
  100% { opacity: 0.8; transform: scale(0.995); }
}

.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(160px);
  opacity: 0.16;
  pointer-events: none;
  z-index: -2;
  animation: floatBlobs 26s infinite alternate ease-in-out;
}
.blob-1 { top: 15%; left: 8%; width: 550px; height: 550px; background: var(--accent-1); }
.blob-2 { bottom: 20%; right: 8%; width: 600px; height: 600px; background: #ec4899; animation-delay: -6s; }

@keyframes floatBlobs {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(40px, 30px) scale(1.1); }
}
/* Контейнер для кнопок управления в верхнем левом углу */
.controls-container {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 1500;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.perf-toggle, .audio-toggle {
  background: var(--bg-panel);
  border: 1px solid var(--border-inner);
  color: var(--text-main);
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--glow);
  display: flex;
  align-items: center;
  gap: 6px;
  transition: var(--transition-smooth);
}

.perf-toggle:hover, .audio-toggle:hover {
  background: var(--accent-1);
  transform: translateY(-2px);
}

.layout-grid {
  display: grid;
  grid-template-columns: minmax(300px, 350px) 1fr minmax(300px, 350px);
  min-height: 100vh;
  max-width: 1920px;
  margin: 0 auto;
}

.sidebar, .sidebar-secondary {
  padding: 40px 18px;
  background: rgba(14, 9, 31, 0.7);
  border-right: 1px solid rgba(181, 95, 252, 0.1);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  overflow-y: auto;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.sidebar-secondary {
  background: rgba(14, 9, 31, 0.55);
  border-right: none;
  border-left: 1px solid rgba(181, 95, 252, 0.1);
}

.sidebar::-webkit-scrollbar, .sidebar-secondary::-webkit-scrollbar {
  width: 4px;
}
.sidebar::-webkit-scrollbar-track, .sidebar-secondary::-webkit-scrollbar-track {
  background: transparent;
}
.sidebar::-webkit-scrollbar-thumb, .sidebar-secondary::-webkit-scrollbar-thumb {
  background: rgba(181, 95, 252, 0);
  border-radius: 99px;
  transition: var(--transition-smooth);
}
.sidebar:hover::-webkit-scrollbar-thumb, .sidebar-secondary:hover::-webkit-scrollbar-thumb {
  background: rgba(181, 95, 252, 0.35);
}

.section-block {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.section-title {
  font-size: 15px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent-1);
  display: flex;
  align-items: center;
  gap: 10px;
  text-shadow: 0 0 15px rgba(181, 95, 252, 0.35);
}

.section-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
}
.main-content {
  padding: 50px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.hero {
  text-align: center;
  margin-bottom: 40px;
  width: 100%;
}

.eyebrow {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(135deg, rgba(181, 95, 252, 0.15), rgba(236, 72, 153, 0.15));
  border: 1px solid rgba(181, 95, 252, 0.25);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
}

h1 {
  margin: 16px 0 8px;
  font-size: clamp(28px, 4.5vw, 52px);
  line-height: 1.1;
  font-weight: 800;
  background: linear-gradient(135deg, #ffffff 40%, #decafc 75%, #ec4899 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 25px rgba(181, 95, 252, 0.15);
}

.subtitle {
  max-width: 640px;
  margin: 0 auto 18px;
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1.6;
}

.analytics-widget {
  width: 100%;
  max-width: 580px;
  margin: 0 auto 24px;
  padding: 16px 20px;
  border-radius: 16px;
  background: rgba(14, 8, 28, 0.6);
  border: 1px solid rgba(181, 95, 252, 0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 16px;
  text-align: left;
}

.analytics-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.analytics-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}

.analytics-value {
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 0 10px rgba(181, 95, 252, 0.2);
}

.search-container {
  width: 100%;
  max-width: 440px;
  margin: 0 auto 24px;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 14px 45px 14px 18px;
  border-radius: 12px;
  background: rgba(11, 7, 24, 0.6);
  border: 1px solid rgba(181, 95, 252, 0.25);
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: var(--transition-smooth);
  backdrop-filter: blur(10px);
}

.search-input:focus {
  border-color: var(--accent-1);
  box-shadow: var(--glow), inset 0 0 8px rgba(181, 95, 252, 0.15);
  background: rgba(11, 7, 24, 0.85);
}

.search-clear-btn {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  display: none;
  transition: var(--transition-smooth);
}

.search-clear-btn:hover {
  color: var(--accent-2);
  text-shadow: 0 0 10px var(--accent-2);
}

.status {
  margin: 14px auto 0;
  width: fit-content;
  padding: 6px 16px;
  border-radius: 999px;
  color: #fff;
  background: rgba(181, 95, 252, 0.05);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
  border: 1px solid rgba(181, 95, 252, 0.2);
  display: flex;
  align-items: center;
  gap: 8px;
}

.status .dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-1);
  box-shadow: 0 0 10px var(--accent-1);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.tree {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.level-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 1000px;
  margin-bottom: 36px;
  transition: var(--transition-smooth);
}

.level-label {
  width: 100%;
  text-align: center;
  margin-bottom: 16px;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  transition: var(--transition-smooth);
}

.level-label:hover {
  color: var(--accent-1);
  text-shadow: 0 0 15px rgba(181, 95, 252, 0.6);
}

.level-label::after {
  content: '▼';
  font-size: 10px;
  transition: transform 0.25s ease;
}

.level-row.collapsed .level-label::after {
  transform: rotate(-90deg);
}

.level-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  transition: var(--transition-smooth);
}

.level-row.collapsed .level-content {
  display: none !important;
}

.sub-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: start;
  gap: 24px;
  width: 100%;
  margin-bottom: 24px;
}
.sub-row:last-child {
  margin-bottom: 0;
}

.connector {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 12px 0;
}

.connector .vline {
  width: 2px;
  height: 40px;
  background: var(--line-grad);
}
.center-card {
  min-width: min(300px, 100%);
  text-align: center;
  padding: 32px 24px;
  border-radius: 22px;
  border: 1px solid var(--border-inner);
  background: rgba(26, 17, 54, 0.8);
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45), var(--glow);
  position: relative;
  flex: 1 1 300px;
  max-width: 440px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: var(--transition-smooth);
  cursor: pointer;
}

.center-card:hover {
  transform: translateY(-5px) scale(1.02);
  border-color: #c084fc;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.55), 0 0 25px rgba(181, 95, 252, 0.5);
}

.center-card::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 22px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  z-index: -1;
  opacity: 0.3;
}

.center-card .icon {
  font-size: 38px;
  line-height: 1;
  margin-bottom: 12px;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
}

.center-card .name {
  display: block;
  font-size: 26px;
  font-weight: 800;
  background: linear-gradient(135deg, #fff 0%, #e9d5ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1.2;
}

.center-card .role {
  display: block;
  color: var(--accent-1);
  margin-top: 8px;
  font-size: 14px;
  font-weight: 600;
}

.group {
  flex: 1 1 290px;
  max-width: 440px;
  border: 1px solid var(--border-outer);
  border-radius: 20px;
  background: var(--bg-panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: var(--transition-smooth);
}

.group:hover {
  transform: translateY(-4px);
  border-color: rgba(181, 95, 252, 0.25);
  box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
}

.group-head {
  padding: 18px 20px 14px;
  border-bottom: 1px solid rgba(181, 95, 252, 0.06);
  background: rgba(255, 255, 255, 0.005);
}

.group-head h2 {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
}

.group-head .sub {
  margin-top: 6px;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.4;
}

.people {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
}

.person {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(255, 255, 255, 0.005);
  border-radius: var(--card-radius);
  background: rgba(255, 255, 255, 0.005);
  transition: var(--transition-smooth);
  cursor: pointer;
  position: relative;
}

.person:hover {
  background: rgba(181, 95, 252, 0.06);
  border-color: rgba(181, 95, 252, 0.22);
  transform: translateX(4px);
}

.avatar {
  flex: 0 0 42px;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  font-size: 22px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.person-info {
  min-width: 0;
  flex: 1;
}

.person-name {
  font-weight: 600;
  font-size: 16px;
  overflow-wrap: anywhere;
  line-height: 1.3;
  color: #fff;
}

.person-role {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 13px;
}

.person.search-fade, .group.search-fade, .center-card.search-fade {
  opacity: 0.15;
  filter: blur(1px) grayscale(0.5);
  transform: scale(0.98);
}

.group.search-hide, .level-row.search-hide {
  display: none !important;
}

.person.partner-highlighted {
  background: rgba(236, 72, 153, 0.12) !important;
  border-color: rgba(236, 72, 153, 0.6) !important;
  box-shadow: var(--glow-partner) !important;
  transform: scale(1.03) translateY(-1px) !important;
  opacity: 1 !important;
  filter: none !important;
}

.rpg-stats {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 18px 0;
  text-align: left;
}

.rpg-stat-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rpg-stat-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
}

.rpg-bar-bg {
  width: 100%;
  height: 8px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.02);
}

.rpg-bar-fill {
  height: 100%;
  border-radius: 99px;
  width: 0%;
  transition: width 0.6s cubic-bezier(0.1, 1, 0.1, 1);
}

.bar-chaos { background: linear-gradient(90deg, #b55ffc, #ec4899); }
.bar-cozy { background: linear-gradient(90deg, #34d399, #059669); }
.bar-resistance { background: linear-gradient(90deg, #fbbf24, #f59e0b); }

.rpg-random-btn {
  width: 100%;
  margin-top: 14px;
  background: rgba(181, 95, 252, 0.1);
  border: 1px solid rgba(181, 95, 252, 0.3);
  color: #fff;
  padding: 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.rpg-random-btn:hover {
  background: var(--accent-1);
  box-shadow: var(--glow);
}

.guestbook-section {
  width: 100%;
  max-width: 580px;
  margin: 40px auto 20px;
  padding: 24px;
  border-radius: 20px;
  background: var(--bg-panel);
  border: 1px solid rgba(181, 95, 252, 0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  text-align: left;
}

.guestbook-section h3 {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 12px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.guestbook-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.guestbook-input-row {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 10px;
}

.gb-input {
  padding: 10px 14px;
  border-radius: 10px;
  background: rgba(11, 7, 24, 0.6);
  border: 1px solid rgba(181, 95, 252, 0.2);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}

.gb-input:focus {
  border-color: var(--accent-1);
}

.gb-btn {
  background: var(--accent-1);
  border: none;
  color: #fff;
  padding: 11px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.gb-btn:hover {
  box-shadow: var(--glow);
  transform: translateY(-1px);
}

.guestbook-messages {
  max-height: 180px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 4px;
}

.guestbook-messages::-webkit-scrollbar {
  width: 4px;
}

.guestbook-messages::-webkit-scrollbar-thumb {
  background: rgba(181, 95, 252, 0.3);
  border-radius: 99px;
}

.gb-msg {
  padding: 10px 14px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.015);
  border: 1px solid rgba(255, 255, 255, 0.03);
  font-size: 13px;
  line-height: 1.4;
}

.gb-msg-author {
  font-weight: 700;
  color: var(--accent-1);
  margin-bottom: 2px;
}

.gb-msg-text {
  color: var(--text-main);
}

.final-quote {
  max-width: 640px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.6;
  margin-top: 20px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(3, 2, 7, 0.75);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-inner);
  box-shadow: var(--glow);
  padding: 34px 28px;
  border-radius: 24px;
  max-width: 440px;
  width: 90%;
  text-align: center;
  transform: scale(0.9);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-overlay.active .modal-card {
  transform: scale(1);
}

.modal-avatar {
  font-size: 64px;
  margin-bottom: 12px;
  display: inline-block;
  animation: bounceEmoji 2s infinite alternate ease-in-out;
}

@keyframes bounceEmoji {
  to { transform: translateY(-8px); }
}

.modal-name {
  font-size: 26px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 4px;
}

.modal-role {
  font-size: 15px;
  color: var(--accent-1);

<body>

<div class="modal-overlay" id="modal-overlay">

<script>
var JSON_FILE = "family.json";
var REFRESH_MS = 30000;
var lastJSON = "";

var RANDOM_FACTS = [
  "Замечен в скрытном поедании ночных вкусняшек на кухне.",
  "Главный генератор хаотичных идей в общем семейном чате.",
  "Обладает абсолютным врождённым иммунитетом к любой домашней душноте.",
  "Регулярно крадет чужие носки, списывая это на аномалии хаоса.",
  "Способен уснуть в любой точке квартиры за 4.2 секунды.",
  "Секретное оружие уюта. Одним присутствием снимает бытовой стресс.",
  "Официально признан самым громким смехом этой вселенной.",
  "Подозревается в тайном заговоре с домашними питомцами ради внеочередной еды.",
  "Мастер создавать панику из-за потерянного телефона, который в этот момент находится в руке.",
  "Гроссмейстер диванных дискуссий и ночных кухонных переговоров."
];

function esc(v) {
  if (!v) return "";
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function levelLabelText(level) {
  var labels = {0: "Старшее поколение", 1: "Родители", 2: "Дети своих родителей", 4: "Племянники и племянницы", 3: "Мои Дети"};
  return labels[level] || ("Уровень " + level);
}

function renderGroup(group) {
  var h = '<article class="group" data-search-block="true">';
  h += '<div class="group-head"><h2>' + esc(group.title) + '</h2>';
  if (group.subtitle && group.subtitle.trim() !== "") {
    h += '<div class="sub">' + esc(group.subtitle) + '</div>';
  }
  h += '</div><div class="people">';
  
  var ppl = group.people || [];
  for (var i = 0; i < ppl.length; i++) {
    var p = ppl[i];
    var pName = p.name || "В ожидании...";
    var pRole = p.role || "Будущий участник экосистемы";
    var pIcon = p.icon || "💜";

    h += '<div class="person" data-name="' + esc(pName) + '" data-role="' + esc(pRole) + '" data-icon="' + esc(pIcon) + '">';
    h += '<div class="avatar">' + esc(pIcon) + '</div>';
    h += '<div class="person-info">';
    h += '<div class="person-name">' + esc(pName) + '</div>';
    h += '<div class="person-role">' + esc(pRole) + '</div>';
    h += '</div><div class="online-dot"></div></div>';
  }
  return h + '</div></article>';
}

function renderCenter(center) {
  var cName = center.name || "shamanVkedax";
  var cRole = center.role || "Основатель Клана";
  var cIcon = center.icon || "💜";

  var h = '<div class="center-card" data-search-block="true" data-name="' + esc(cName) + '" data-role="' + esc(cRole) + '" data-icon="' + esc(cIcon) + '">';
  h += '<div class="icon">' + esc(cIcon) + '</div>';
  h += '<span class="name">' + esc(cName) + '</span>';
  h += '<span class="role">' + esc(cRole) + '</span></div>';
  return h;
}

function populateSidebar(elementId, dataArray) {
  var h = "";
  for (var i = 0; i < dataArray.length; i++) { h += renderGroup(dataArray[i]); }
  document.getElementById(elementId).innerHTML = h;
}

function getPartnerName(name) {
  var pairs = {"Diamonita Grand": "EKSOD_GRAND", "EKSOD_GRAND": "Diamonita Grand", "§LAGDAN§": "vera ba7a", "vera ba7a": "§LAGDAN§"};
  return pairs[name] || null;
}

function generateChaosStatus(name, role) {
  if (!name || name === "В ожидании...") return "Официальный протокол: Ячейка зарезервирована в хрониках семейной базы данных.";
  if (name === "Diamonita Grand" || name === "EKSOD_GRAND" || name === "sataney" || name === "卄乇ㄥㄥ匚卂ㄒ") return "Особый статус: Взаимное притяжение сердец. Нарушение законов хаоса ради абсолютного уюта. 💜";
  if (name === "vera ba7a" || name === "§LAGDAN§") return "Кровные узы: Родные брат и сестра. Фундамент и вековая мудрость старшего поколения хроник хаоса.";
  if (role.toLowerCase().indexOf("священник") !== -1) return "Влияние на экосистему: Регулярно отпускает грехи семейного хаоса. Духовный щит дома укреплен.";
  if (role.toLowerCase().indexOf("психотерапевт") !== -1) return "Влияние на экосистему: Восстанавливает ментальное здоровье семьи после затяжных бытовых штормов.";
  if (role.toLowerCase().indexOf("участковый") !== -1) return "Влияние на экосистему: Контролирует соблюдение границ комендантского часа и уровень шума в хрониках.";
  if (role.toLowerCase().indexOf("кот") !== -1 || role.toLowerCase().indexOf("песель") !== -1 || role.toLowerCase().indexOf("собака") !== -1) return "Статус в хаосе: Пушистый хранитель тепла. Назначение — генерация мурчания и требование внеочередной еды. 🐾";
  return "Официальный протокол: Active участник семейной вселенной. Создает неповторимый баланс уюта и драйва.";
}

function getRPGStats(name) {
  if (!name || name === "В ожидании...") return { chaos: 0, cozy: 100, resist: 100 };
  var code = 0;
  for (var i = 0; i < name.length; i++) { code += name.charCodeAt(i); }
  return { chaos: (code % 45) + 55, cozy: ((code * 3) % 40) + 60, resist: ((code * 7) % 50) + 50 };
}
function render(d) {
  var h = (id, t) => { var el = document.getElementById(id); if(el) el.textContent = t || ""; };
  document.title = d.title || "Семейное древо"; 
  h("eyebrow", d.eyebrow); h("title", d.title); h("subtitle", d.subtitle);
  
  var foot = document.getElementById("footer");
  if(foot) foot.innerHTML = (d.footer || "").replace(/💜/g, '<span class="emerald-heart">💜</span>');
  
  populateSidebar("sidebar", d.closePeople || []); 
  populateSidebar("sidebar-secondary", d.secondaryPeople || []);
  
  var gr = d.groups || [], lv = {};
  gr.forEach(g => { var l = g.level || 0; if(!lv[l]) lv[l] = []; lv[l].push(g); });
  
  var t = '<div class="tree">';
  Object.keys(lv).sort((a,b)=>a-b).forEach((l, idx) => {
    var n = Number(l); if (idx > 0) t += '<div class="connector" data-level-conn="'+n+'"><div class="vline"></div></div>';
    t += '<div class="level-row" id="level-row-'+n+'"><div class="level-label" onclick="toggleLevelRow('+n+')">'+esc(levelLabelText(n))+'</div><div class="level-content">';
    if (n === 2) {
      t += '<div class="sub-row">'; if (d.center) t += renderCenter(d.center);
      var w = lv[l].find(g => g.title && g.title.includes("Жена")); if (w) t += renderGroup(w);
      t += '</div><div class="sub-row">'; lv[l].filter(g => g.title && !g.title.includes("Жена")).forEach(g => t += renderGroup(g)); t += '</div>';
    } else if (n === 3) {
      t += '<div class="sub-row">'; lv[l].filter(g => g.title && !g.title.includes("Зятья") && !g.title.includes("Снохи")).forEach(g => t += renderGroup(g));
      t += '</div><div class="sub-row">'; lv[l].filter(g => g.title && (g.title.includes("Зятья") || g.title.includes("Снохи"))).forEach(g => t += renderGroup(g)); t += '</div>';
    } else { t += '<div class="sub-row">'; lv[l].forEach(g => t += renderGroup(g)); t += '</div>'; }
    t += '</div></div>';
  });
  
  var cont = document.getElementById("content");
  if(cont) cont.innerHTML = t + '</div>';
  
  var pT = d.center ? 1 : 0, peT = 0, cM = 0, cName = "shamanVkedax";
  gr.forEach(g => { 
    var s = (g.people || []).length; pT += s; 
    var cl = g.title ? g.title.replace(/[^\w\sа-яА-ЯёЁ]/g, '').trim() : ""; 
    if(s > cM && cl !== "Зятья" && cl !== "Любимые Снохи") { cM = s; cName = cl; } 
  });
  
  (d.closePeople || []).forEach(s => { 
    var l = (s.people || []).length; 
    if(s.title && (s.title.includes("питомцы") || s.title.includes("🐾"))) peT += l; else pT += l; 
  });
  (d.secondaryPeople || []).forEach(s => pT += (s.people || []).length);
  
  var kC = 0; 
  gr.filter(g => g.level === 3 && g.title && !g.title.includes("Снохи") && !g.title.includes("Зятья")).forEach(k => kC += (k.people || []).length);
  
  h("stat-people", pT); h("stat-pets", peT); h("stat-stable", Math.max(12, 100 - (kC * 8)) + "%"); h("stat-clan", cName);
  applySearchFilter(); initOnlineDots();
}

function toggleLevelRow(n) {
  var r = document.getElementById('level-row-' + n); if(!r) return; r.classList.toggle('collapsed');
  var c = document.querySelector('.connector[data-level-conn="' + (n + 1) + '"]'); if(c) c.style.display = r.classList.contains('collapsed') ? 'none' : 'flex';
}

function initOnlineDots() {
  document.querySelectorAll('.online-dot').forEach(d => { var r = Math.random(); if(r < 0.35) d.classList.add('active-cozy'); else if(r < 0.65) d.classList.add('active-chaos'); });
}

function loadFamily() {
  var s = document.getElementById("status");
  fetch(JSON_FILE + "?v=" + Date.now(), {cache: "no-store"})
    .then(r => r.text())
    .then(t => { if(t !== lastJSON) { render(JSON.parse(t)); lastJSON = t; } s.innerHTML = '<span class="dot"></span>Экосистема активна'; })
    .catch(e => { s.innerHTML = '<span class="dot" style="background:#f87171;"></span>Сбой'; });
}

function applySearchFilter() {
  var q = document.getElementById("tree-search").value.toLowerCase().trim(), c = document.querySelector('.center-card');
  if(!q) { document.querySelectorAll('.search-fade, .search-hide').forEach(i => i.classList.remove('search-fade', 'search-hide')); document.getElementById("search-clear-btn").style.display = "none"; return; }
  document.getElementById("search-clear-btn").style.display = "block";
  if(c) { var n = (c.getAttribute('data-name')||'').toLowerCase(), r = (c.getAttribute('data-role')||'').toLowerCase(); if(n.includes(q) || r.includes(q)) c.classList.remove('search-fade'); else c.classList.add('search-fade'); }
  document.querySelectorAll('.group').forEach(g => {
    var m = false; g.querySelectorAll('.person').forEach(p => {
      var n = (p.getAttribute('data-name')||'').toLowerCase(), r = (p.getAttribute('data-role')||'').toLowerCase();
      if(n.includes(q) || r.includes(q)) { p.classList.remove('search-fade'); m = true; } else p.classList.add('search-fade');
    });
    if(m) g.classList.remove('search-fade', 'search-hide'); else g.classList.add('search-fade');
  });
  document.querySelectorAll('.level-row').forEach(row => { if(row.querySelectorAll('.center-card:not(.search-fade), .group:not(.search-fade)').length === 0) row.classList.add('search-hide'); else row.classList.remove('search-hide'); });
  document.querySelectorAll('.connector').forEach(co => { 
    var next = document.getElementById('level-row-' + co.getAttribute('data-level-conn')); 
    if(next && next.classList.contains('search-hide')) co.classList.add('search-hide'); 
    else co.classList.remove('search-hide'); 
  });
}

document.getElementById('search-clear-btn').addEventListener('click', () => { var i = document.getElementById("tree-search"); i.value = ""; i.focus(); applySearchFilter(); });

var perfToggle = document.getElementById('perf-toggle');
if(localStorage.getItem('perfMode') === 'true') { document.body.classList.add('perf-mode'); perfToggle.textContent = "🚀 Обычный режим"; }
perfToggle.addEventListener('click', () => { var p = document.body.classList.toggle('perf-mode'); localStorage.setItem('perfMode', p); perfToggle.textContent = p ? "🚀 Обычный режим" : "⚡ Слабый ПК / Телефон"; });

var modalOverlay = document.getElementById('modal-overlay');
document.addEventListener('click', e => {
  var t = e.target.closest('.person') || e.target.closest('.center-card'); if(!t) return;
  var n = t.getAttribute('data-name') || "В ожидании...", r = t.getAttribute('data-role') || 'Будущий участник экосистемы', i = t.getAttribute('data-icon') || '💜';
  document.getElementById('modal-avatar').textContent = i; document.getElementById('modal-name').textContent = n; document.getElementById('modal-role').textContent = r;
  document.getElementById('modal-badge').textContent = generateChaosStatus(n, r); var rpg = getRPGStats(n);
  ['chaos', 'cozy', 'resistance'].forEach(k => { var key = k === 'resistance' ? 'resist' : k; document.getElementById('rpg-bar-' + k).style.width = '0%'; document.getElementById('rpg-val-' + k).textContent = rpg[key] + "%"; setTimeout(() => { document.getElementById('rpg-bar-' + k).style.width = rpg[key] + "%"; }, 100); });
  modalOverlay.classList.add('active');
});

document.getElementById('rpg-random-btn').addEventListener('click', () => { var b = document.getElementById('modal-badge'); b.style.opacity = 0; setTimeout(() => { b.textContent = RANDOM_FACTS[Math.floor(Math.random() * RANDOM_FACTS.length)]; b.style.opacity = 1; }, 200); });
document.getElementById('modal-close').addEventListener('click', () => modalOverlay.classList.remove('active'));
modalOverlay.addEventListener('click', e => { if(e.target === modalOverlay) modalOverlay.classList.remove('active'); });
document.getElementById('tree-search').addEventListener('input', applySearchFilter);

var guestbookForm = document.getElementById('guestbook-form'), guestbookMessages = document.getElementById('guestbook-messages');
function loadGuestbook() {
  var msgs = JSON.parse(localStorage.getItem('family_guestbook_msgs') || '[{"name":"did1","text":"Уютный terminal получился. Батя одобряет! 👍"},{"name":"sataney","text":"Подсветка для нас с котиком — просто шикарная! 💜"}]'), h = "";
  for(var i = msgs.length - 1; i >= 0; i--) h += '<div class="gb-msg"><div class="gb-msg-author">' + esc(msgs[i].name) + '</div><div class="gb-msg-text">' + esc(msgs[i].text) + '</div></div>';
  guestbookMessages.innerHTML = h;
}

guestbookForm.addEventListener('submit', e => {
  e.preventDefault(); var nI = document.getElementById('gb-name'), tI = document.getElementById('gb-text'), n = nI.value.trim(), t = tI.value.trim(); if(!n || !t) return;
  var msgs = JSON.parse(localStorage.getItem('family_guestbook_msgs') || '[{"name":"did1","text":"Уютный terminal получился. Батя одобряет! 👍"},{"name":"sataney","text":"Подсветка для нас с котиком — просто шикарная! 💜"}]');
  msgs.push({name: n, text: t}); localStorage.setItem('family_guestbook_msgs', JSON.stringify(msgs)); tI.value = ""; loadGuestbook(); if(navigator.vibrate) navigator.vibrate(30);
});

document.addEventListener('mouseover', e => {
  if(document.body.classList.contains('perf-mode')) return;
  var p = e.target.closest('.person'); if(!p) return;
  var pN = getPartnerName(p.getAttribute('data-name')); if(!pN) return;
  var pC = document.querySelector('.person[data-name="' + pN + '"]'); p.classList.add('partner-highlighted'); if(pC) pC.classList.add('partner-highlighted');
});

document.addEventListener('mouseout', e => {
  var p = e.target.closest('.person'); if(!p) return;
  var pN = getPartnerName(p.getAttribute('data-name')); if(!pN) return;
  var pC = document.querySelector('.person[data-name="' + pN + '"]'); p.classList.remove('partner-highlighted'); if(pC) pC.classList.remove('partner-highlighted');
});

loadGuestbook(); loadFamily(); setInterval(loadFamily, REFRESH_MS);
</script>
</body>
</html>
