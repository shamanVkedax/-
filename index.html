<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейное древо</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128156;</text></svg>">
<style>
:root{
  --bg1:#0d0a1a;--bg2:#1a1230;
  --card:rgba(28,21,49,.82);
  --text:#f5f0ff;--muted:#a895c4;--muted2:#8a7ba8;
  --accent:#b07cff;--accent2:#ff79c6;--accent3:#5eead4;
  --border:rgba(188,124,255,.18);--border-bright:rgba(188,124,255,.4);
  --green:#6ee7b7;--pink:#f9a8d4;--blue:#93c5fd;--gold:#fcd34d;
  --line:rgba(188,124,255,.3);
  --shadow:0 12px 40px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;color:var(--text);
  font-family:'Segoe UI','Inter',system-ui,sans-serif;
  background:
    radial-gradient(ellipse at 15% 8%,rgba(176,124,255,.15),transparent 35%),
    radial-gradient(ellipse at 85% 25%,rgba(255,121,198,.1),transparent 30%),
    radial-gradient(ellipse at 50% 90%,rgba(94,234,212,.06),transparent 40%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
}
.page{max-width:1400px;margin:0 auto;padding:40px 20px 60px}
.hero{text-align:center;margin-bottom:40px}
.eyebrow{
  display:inline-block;padding:7px 16px;
  border:1px solid rgba(220,185,255,.22);border-radius:999px;
  color:#dac4ee;background:rgba(255,255,255,.04);
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
}
h1{
  margin:16px 0 8px;font-size:clamp(32px,6vw,64px);line-height:1.05;
  letter-spacing:-.04em;font-weight:800;
  background:linear-gradient(100deg,#fff,#d8b8ff,#ffacd9);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.subtitle{max-width:680px;margin:0 auto;color:var(--muted);font-size:16px;line-height:1.6}
.status{
  margin:14px auto 0;width:fit-content;padding:6px 14px;border-radius:999px;
  color:#a298b4;background:rgba(255,255,255,.04);font-size:11px;
  border:1px solid rgba(255,255,255,.05);
}
.status .dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--green);margin-right:6px;animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tree{display:flex;flex-direction:column;align-items:center}
.level-row{
  display:flex;flex-wrap:wrap;justify-content:center;gap:20px;
  width:100%;position:relative;
}
.level-label{
  width:100%;text-align:center;margin-bottom:10px;
  font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted2);
}
.connector{
  display:flex;flex-direction:column;align-items:center;
  width:100%;padding:10px 0;position:relative;
}
.connector .vline{
  width:2px;height:36px;
  background:linear-gradient(to bottom,transparent,var(--line),transparent);
}
.connector .parent-note{
  font-size:10px;color:var(--muted2);margin-top:4px;letter-spacing:.05em;
}
.center-card{
  min-width:min(320px,100%);text-align:center;
  padding:24px 28px;border-radius:22px;
  border:1px solid var(--border-bright);
  background:linear-gradient(135deg,rgba(176,124,255,.18),rgba(255,121,198,.08)),rgba(20,15,37,.95);
  box-shadow:0 16px 50px rgba(176,124,255,.15);
  position:relative;flex:1 1 320px;max-width:380px;
}
.center-card::before{
  content:'';position:absolute;inset:-2px;border-radius:22px;
  background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));
  z-index:-1;opacity:.25;filter:blur(10px);
}
.center-card .icon{font-size:32px;line-height:1}
.center-card .name{display:block;font-size:24px;font-weight:800;margin-top:6px;
  background:linear-gradient(100deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.center-card .role{display:block;color:#cfbce7;margin-top:4px;font-size:13px;font-style:italic}
.group{
  flex:1 1 320px;max-width:380px;
  border:1px solid var(--border);border-radius:20px;
  background:var(--card);backdrop-filter:blur(14px);
  overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s;
}
.group:hover{border-color:var(--border-bright);transform:translateY(-3px);box-shadow:var(--shadow)}
.group-head{padding:14px 18px 10px;border-bottom:1px solid rgba(255,255,255,.05)}
.group-head h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.group-head .sub{margin-top:4px;color:var(--muted2);font-size:12px;line-height:1.4}
.parent-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:8px;
  font-size:10px;font-weight:600;letter-spacing:.04em;
  background:rgba(176,124,255,.1);color:var(--accent);
  border:1px solid rgba(176,124,255,.2);
  margin-left:auto;white-space:nowrap;
}
.parent-badge::before{content:'\21B3';font-size:12px}
.group-tag{
  display:inline-block;padding:2px 8px;border-radius:6px;
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;
}
.people{display:flex;flex-direction:column;gap:8px;padding:12px}
.person{
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  border:1px solid rgba(255,255,255,.04);border-radius:14px;
  background:rgba(255,255,255,.025);transition:all .18s;
}
.person:hover{background:rgba(176,124,255,.06);border-color:rgba(176,124,255,.15)}
.avatar{
  flex:0 0 38px;width:38px;height:38px;display:grid;place-items:center;
  border-radius:12px;font-size:18px;
  background:linear-gradient(135deg,rgba(176,124,255,.2),rgba(255,121,198,.1));
  border:1px solid rgba(255,255,255,.05);
}
.person-info{min-width:0;flex:1}
.person-name{font-weight:700;font-size:14px;overflow-wrap:anywhere;line-height:1.3}
.person-role{margin-top:2px;color:var(--muted2);font-size:11px;line-height:1.3}
.close-section{margin-top:60px}
.close-divider{display:flex;align-items:center;gap:16px;margin:0 auto 30px;max-width:600px}
.close-divider .line{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--border-bright),transparent)}
.close-divider .label{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.close-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.footer{
  text-align:center;margin-top:50px;padding:24px;
  color:#8a7ba8;font-size:13px;line-height:1.7;
  border-top:1px solid rgba(255,255,255,.05);
}
.footer .heart{color:var(--accent2)}
.error-box{
  max-width:600px;margin:30px auto;padding:20px;
  border:1px solid #75405b;border-radius:16px;background:#281421;
  color:#f0a0b8;text-align:center;font-size:14px;line-height:1.6;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.group,.center-card{animation:fadeIn .4s ease-out}
@media(max-width:1000px){.group,.center-card{flex:1 1 280px;max-width:340px}}
@media(max-width:680px){
  .page{padding:28px 12px 40px}
  .group,.center-card{flex:1 1 100%;max-width:none}
  .center-card{padding:20px 16px}
  .center-card .name{font-size:22px}
  .parent-badge{margin-left:0;margin-top:4px}
}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="eyebrow" id="eyebrow">Загрузка...</div>
    <h1 id="title">Семейное древо</h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="status" id="status"><span class="dot"></span>Загружаю family.json...</div>
  </header>
  <section id="content"></section>
  <footer class="footer" id="footer"></footer>
</main>
<script>
var JSON_FILE = "./family.json";
var REFRESH_MS = 30000;
var lastJSON = "";

function esc(v) {
  v = v || "";
  v = String(v);
  return v.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function levelLabelText(level) {
  var labels = {
    0: "Старшее поколение",
    1: "Родители",
    2: "Наше поколение",
    3: "Дети и племянники"
  };
  return labels[level] || ("Уровень " + level);
}

function parentLabel(parent) {
  if (!parent) return null;
  if (parent === "center") return "от shamanVkedax";
  var clean = parent.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "").trim();
  return "от " + clean;
}

function renderGroup(group, tagClass, tagText) {
  var pLabel = parentLabel(group.parent);
  var h = "";
  h += '<article class="group">';
  h += '<div class="group-head">';
  h += '<h2>';
  h += esc(group.title);
  h += ' <span class="group-tag tag-' + tagClass + '">' + esc(tagText) + '</span>';
  if (pLabel) {
    h += ' <span class="parent-badge">' + esc(pLabel) + '</span>';
  }
  h += '</h2>';
  h += '<div class="sub">' + esc(group.subtitle || "") + '</div>';
  h += '</div>';
  h += '<div class="people">';
  var ppl = group.people || [];
  for (var i = 0; i < ppl.length; i++) {
    var person = ppl[i];
    h += '<div class="person">';
    h += '<div class="avatar">' + esc(person.icon || "\uD83D\uDC9C") + '</div>';
    h += '<div class="person-info">';
    h += '<div class="person-name">' + esc(person.name) + '</div>';
    h += '<div class="person-role">' + esc(person.role || "") + '</div>';
    h += '</div>';
    h += '</div>';
  }
  h += '</div>';
  h += '</article>';
  return h;
}

function renderCenter(center) {
  var h = "";
  h += '<div class="center-card">';
  h += '<div class="icon">' + esc(center.icon || "\uD83D\uDC9C") + '</div>';
  h += '<span class="name">' + esc(center.name || "Я") + '</span>';
  h += '<span class="role">' + esc(center.role || "") + '</span>';
  h += '</div>';
  return h;
}

function render(data) {
  document.title = data.title || "Семейное древо";
  document.getElementById("eyebrow").textContent = data.eyebrow || "";
  document.getElementById("title").textContent = data.title || "Семейное древо";
  document.getElementById("subtitle").textContent = data.subtitle || "";
  var footerText = (data.footer || "").replace(/\uD83D\uDC9C/g, '<span class="heart">\uD83D\uDC9C</span>');
  document.getElementById("footer").innerHTML = footerText;

  var center = data.center || {};
  var centerLevel = (center.level !== undefined) ? center.level : 2;
  var groups = Array.isArray(data.groups) ? data.groups : [];
  var closePeople = Array.isArray(data.closePeople) ? data.closePeople : [];

  var levels = {};
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    var lv = (g.level !== undefined) ? g.level : 0;
    if (!levels[lv]) levels[lv] = [];
    levels[lv].push(g);
  }

  if (!levels[centerLevel]) levels[centerLevel] = [];
  levels[centerLevel]._hasCenter = true;

  var sortedLevels = Object.keys(levels).sort(function(a, b) { return Number(a) - Number(b); });

  var html = '<div class="tree">';

  for (var idx = 0; idx < sortedLevels.length; idx++) {
    var lv = sortedLevels[idx];
    var levelNum = Number(lv);

    if (idx > 0) {
      var note = "";
      if (levelNum === 1) note = "дети дедушки и бабушки";
      else if (levelNum === 2) note = "дети родителей";
      else if (levelNum === 3) note = "следующее поколение";
      
      html += '<div class="connector">';
      html += '<div class="vline"></div>';
      if (note) html += '<div class="parent-note">' + esc(note) + '</div>';
      html += '</div>';
    }

    html += '<div class="level-row">';
    html += '<div class="level-label">' + esc(levelLabelText(levelNum)) + '</div>';

    if (levels[lv]._hasCenter) {
      html += renderCenter(center);
    }

    var lvGroups = levels[lv];
    for (var j = 0; j < lvGroups.length; j++) {
      var tag = String(levelNum);
      var tagText = levelLabelText(levelNum);
      html += renderGroup(lvGroups[j], tag, tagText);
    }

    html += '</div>';
  }

  html += '</div>';

  if (closePeople.length > 0) {
    html += '<div class="close-section">';
    html += '<div class="close-divider">';
    html += '<div class="line"></div>';
    html += '<span class="label">Близкие люди</span>';
    html += '<div class="line"></div>';
    html += '</div>';
    html += '<div class="close-grid">';
    for (var k = 0; k < closePeople.length; k++) {
      html += renderGroup(closePeople[k], "special", "Родные по духу");
    }
    html += '</div>';
    html += '</div>';
  }

  document.getElementById("content").innerHTML = html;
}

function loadFamily() {
  var status = document.getElementById("status");
  fetch(JSON_FILE + "?v=" + Date.now(), { cache: "no-store" })
    .then(function(resp) {
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.text();
    })
    .then(function(text) {
      var data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("Ошибка JSON: " + e.message);
      }
      if (text !== lastJSON) {
        render(data);
        lastJSON = text;
        status.innerHTML = '<span class="dot"></span>Обновлено: ' + new Date().toLocaleTimeString("ru-RU");
      } else {
        status.innerHTML = '<span class="dot"></span>Проверено: ' + new Date().toLocaleTimeString("ru-RU");
      }
    })
    .catch(function(err) {
      status.innerHTML = '<span class="dot" style="background:#f87171"></span>Ошибка: ' + err.message;
      if (!lastJSON) {
        document.getElementById("content").innerHTML = '<div class="error-box">Ошибка загрузки <b>family.json</b>.<br>1. Файл <b>family.json</b> лежит в корне репозитория.<br>2. В JSON нет синтаксических ошибок.<br>3. Открой консоль (F12).</div>';
      }
      console.error(err);
    });
}

loadFamily();
setInterval(loadFamily, REFRESH_MS);
</script>
</body>
</html>
