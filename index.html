<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейное древо — Интерактивный Холст</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #06030a;
  --bg-panel: rgba(14, 10, 26, 0.8);
  --accent-1: #8b5cf6;
  --accent-2: #ec4899;
  --accent-3: #10b981;
  --text-main: #f3f1f6;
  --text-muted: #9c91aa;
  --border-inner: rgba(139, 92, 246, 0.45);
  --border-outer: rgba(255, 255, 255, 0.04);
  --glow: 0 0 20px rgba(139, 92, 246, 0.2);
  --glow-partner: 0 0 25px rgba(236, 72, 153, 0.5);
  --card-radius: 16px;
  --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}

body {
  height: 100vh;
  margin: 0;
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg-dark);
  overflow: hidden;
  position: relative;
}

/* Сетка чертежного холста на фоне */
.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-color: #06030a;
  background-image: 
    radial-gradient(rgba(139, 92, 246, 0.08) 1px, transparent 0),
    radial-gradient(rgba(236, 72, 153, 0.04) 1px, transparent 0);
  background-size: 24px 24px;
  background-position: 0 0, 12px 12px;
}

/* Декоративные размытые неоновые сферы */
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(160px);
  opacity: 0.12;
  pointer-events: none;
}
.blob-1 { top: -10%; left: 20%; width: 600px; height: 600px; background: var(--accent-1); }
.blob-2 { bottom: -10%; right: 20%; width: 600px; height: 600px; background: var(--accent-2); }
.layout-grid {
  display: grid;
  grid-template-columns: 340px 1fr 340px;
  height: 100vh;
  max-width: 100vw;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

/* Фиксированные сайдбары по краям экрана */
.sidebar, .sidebar-secondary {
  padding: 40px 24px;
  background: rgba(4, 2, 8, 0.7);
  border-right: 1px solid rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  overflow-y: auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 36px;
  z-index: 10;
}

.sidebar-secondary {
  border-right: none;
  border-left: 1px solid rgba(255, 255, 255, 0.04);
  background: rgba(4, 2, 8, 0.55);
}

/* Изящный скрывающийся скроллбар панелей */
.sidebar::-webkit-scrollbar, .sidebar-secondary::-webkit-scrollbar, .canvas-viewport::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.sidebar::-webkit-scrollbar-track, .sidebar-secondary::-webkit-scrollbar-track, .canvas-viewport::-webkit-scrollbar-track {
  background: transparent;
}
.sidebar::-webkit-scrollbar-thumb, .sidebar-secondary::-webkit-scrollbar-thumb, .canvas-viewport::-webkit-scrollbar-thumb {
  background: rgba(139, 92, 246, 0);
  border-radius: 99px;
  transition: var(--transition-smooth);
}
.sidebar:hover::-webkit-scrollbar-thumb, .sidebar-secondary:hover::-webkit-scrollbar-thumb, .canvas-viewport:hover::-webkit-scrollbar-thumb {
  background: rgba(139, 92, 246, 0.3);
}

.section-block {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.section-title {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent-2);
  display: flex;
  align-items: center;
  gap: 10px;
  text-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
}

.section-desc {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
}

.card-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sidebar-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-outer);
  border-radius: var(--card-radius);
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: var(--transition-smooth);
}

.sidebar-card:hover {
  transform: translateX(4px);
  border-color: rgba(139, 92, 246, 0.35);
  box-shadow: var(--glow);
  background: rgba(20, 14, 38, 0.9);
}

.avatar-small {
  flex: 0 0 38px;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 20px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.info-small h4 {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
}

.info-small p {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 1px;
}

/* Центральная интерактивная область холста */
.canvas-viewport {
  height: 100vh;
  overflow: auto;
  position: relative;
  display: flex;
  flex-direction: column;
}

.main-content {
  padding: 60px 80px;
  min-width: max-content;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.hero {
  margin-bottom: 54px;
  max-width: 650px;
  position: sticky;
  left: 80px;
}

.eyebrow {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(236, 72, 153, 0.15));
  border: 1px solid rgba(139, 92, 246, 0.25);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 700;
}

h1 {
  margin: 16px 0 8px;
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #ffffff 40%, #ffd6eb 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.6;
}

.status {
  margin-top: 14px;
  width: fit-content;
  padding: 6px 16px;
  border-radius: 999px;
  color: #fff;
  background: rgba(16, 185, 129, 0.05);
  font-size: 12px;
  font-weight: 500;
  border: 1px solid rgba(16, 185, 129, 0.2);
  display: flex;
  align-items: center;
  gap: 8px;
}

.status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-3);
  box-shadow: 0 0 10px var(--accent-3);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Древо: Горизонтальные поколения (Слева направо) */
.tree {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 48px;
  padding-bottom: 40px;
}

.level-column {
  display: flex;
  flex-direction: column;
  gap: 24px;
  width: 380px;
  position: relative;
}

.level-label {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-muted);
  opacity: 0.7;
  padding-left: 4px;
  border-left: 2px solid var(--accent-1);
}

/* Измененный горизонтальный коннектор между поколениями */
.connector-h {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 100%;
  position: relative;
}
.connector-h .hline {
  width: 48px;
  height: 2px;
  background: linear-gradient(to right, rgba(139, 92, 246, 0.35), rgba(236, 72, 153, 0.15));
  margin-top: 40px;
}

.center-card {
  width: 100%;
  padding: 28px 24px;
  border-radius: 22px;
  border: 1px solid var(--border-inner);
  background: rgba(18, 12, 36, 0.9);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), var(--glow);
  position: relative;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: var(--transition-smooth);
}

.center-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), 0 0 25px rgba(139, 92, 246, 0.4);
}

.center-card::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 22px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  z-index: -1;
  opacity: 0.25;
}

.center-card .icon {
  font-size: 36px;
  margin-bottom: 10px;
  filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.35));
}

.center-card .name {
  display: block;
  font-size: 24px;
  font-weight: 800;
  background: linear-gradient(135deg, #fff 0%, #d8cff0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.center-card .role {
  display: block;
  color: var(--accent-2);
  margin-top: 6px;
  font-size: 13px;
  font-weight: 600;
}

.group {
  width: 100%;
  border: 1px solid var(--border-outer);
  border-radius: 18px;
  background: var(--bg-panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  overflow: hidden;
  transition: var(--transition-smooth);
}

.group:hover {
  transform: translateY(-3px);
  border-color: rgba(255, 255, 255, 0.1);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}

.group-head {
  padding: 16px 18px 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  background: rgba(255, 255, 255, 0.01);
}

.group-head h2 {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
}

.group-head .sub {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 12px;
  line-height: 1.4;
}

.people {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px;
}

.person {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid rgba(255, 255, 255, 0.01);
  border-radius: var(--card-radius);
  background: rgba(255, 255, 255, 0.01);
  transition: var(--transition-smooth);
}

.person:hover {
  background: rgba(139, 92, 246, 0.06);
  border-color: rgba(139, 92, 246, 0.18);
  transform: translateX(4px);
}

/* Неприкосновенный эффект взаимной неоновой подсветки влюбленных */
.person.partner-highlighted {
  background: rgba(236, 72, 153, 0.1) !important;
  border-color: rgba(236, 72, 153, 0.55) !important;
  box-shadow: var(--glow-partner) !important;
  transform: scale(1.025) translateX(4px);
}

.avatar {
  flex: 0 0 38px;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  font-size: 18px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.person-info {
  min-width: 0;
  flex: 1;
}

.person-name {
  font-weight: 600;
  font-size: 14px;
  overflow-wrap: anywhere;
  color: #fff;
}

.person-role {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 12px;
}

.final-quote {
  margin-top: 50px;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.6;
  max-width: 600px;
  padding-top: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.04);
  position: sticky;
  left: 80px;
}

.heart { color: #a855f7; display: inline-block; }

@media (max-width: 1200px) {
  .layout-grid { grid-template-columns: 1fr; height: auto; overflow: auto; }
  .sidebar, .sidebar-secondary { height: auto; position: relative; border: none; backdrop-filter: none; }
  .canvas-viewport { height: auto; overflow: visible; }
  .main-content { padding: 40px 20px; min-width: 100%; }
  .hero, .final-quote { position: relative; left: 0; }
  .tree { flex-direction: column; width: 100%; gap: 32px; }
  .level-column { width: 100%; }
  .connector-h { display: none; }
}
</style>
</head>
<body>

<!-- Интерактивная чертежная сетка и неоновый фон -->
<div class="bg-canvas">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<main class="layout-grid">
  <!-- Левая фиксированная панель: Близкий круг и Питомцы -->
  <aside class="sidebar" id="sidebar"></aside>
  
  <!-- Центральная область холста с независимой прокруткой -->
  <div class="canvas-viewport">
    <div class="main-content">
      
      <header class="hero">
        <div class="eyebrow" id="eyebrow">Интеграция систем...</div>
        <h1 id="title">Семейное древо</h1>
        <p class="subtitle" id="subtitle"></p>
        <div class="status" id="status"><span class="dot"></span>Развертывание холста family.json...</div>
      </header>

      <!-- Контейнер для динамической горизонтальной генерации древа -->
      <section id="content"></section>
      
      <!-- Семейные хроники -->
      <footer class="final-quote" id="footer"></footer>
      
    </div>
  </div>
  
  <!-- Правая фиксированная панель: Окружение и Инфраструктура -->
  <aside class="sidebar-secondary" id="sidebar-secondary"></aside>
</main>
<script>
var JSON_FILE = "family.json";
var REFRESH_MS = 30000;
var lastJSON = "";

// Функция безопасного экранирования спецсимволов (Защита от XSS-уязвимостей)
function esc(v) {
  if (!v) return "";
  return String(v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function levelLabelText(level) {
  var labels = {0: "Старшее поколение", 1: "Родители", 2: "Дети своих родителей", 4: "Племянники и племянницы", 3: "Мои Дети"};
  return labels[level] || ("Уровень " + level);
}

function renderGroup(group, tagClass, showGenTag) {
  var h = "";
  h += '<article class="group">';
  h += '<div class="group-head">';
  h += '<h2>' + esc(group.title) + '</h2>';
  h += '<div class="sub">' + esc(group.subtitle || "") + '</div>';
  h += '</div>';
  h += '<div class="people">';
  var ppl = group.people || [];
  for (var i = 0; i < ppl.length; i++) {
    var p = ppl[i];
    h += '<div class="person" data-name="' + esc(p.name) + '">';
    h += '<div class="avatar">' + esc(p.icon || "💜") + '</div>';
    h += '<div class="person-info">';
    h += '<div class="person-name">' + esc(p.name) + '</div>';
    h += '<div class="person-role">' + esc(p.role || "") + '</div>';
    h += '</div>';
    h += '</div>';
  }
  h += '</div>';
  h += '</article>';
  return h;
}

function renderCenter(center) {
  var h = '<div class="center-card">';
  h += '<div class="icon">' + esc(center.icon || "💜") + '</div>';
  h += '<span class="name">' + esc(center.name || "Я") + '</span>';
  h += '<span class="role">' + esc(center.role || "") + '</span>';
  h += '</div>';
  return h;
}

function populateSidebar(elementId, dataArray) {
  var h = "";
  for (var i = 0; i < dataArray.length; i++) {
    var section = dataArray[i];
    h += '<div class="section-block">';
    h += '<div class="section-title">' + esc(section.title || "") + '</div>';
    h += '<p class="section-desc">' + esc(section.subtitle || "") + '</p>';
    h += '<div class="card-list">';
    var ppl = section.people || [];
    for (var j = 0; j < ppl.length; j++) {
      var p = ppl[j];
      h += '<div class="sidebar-card">';
      h += '<div class="avatar-small">' + esc(p.icon || "💜") + '</div>';
      h += '<div class="info-small">';
      h += '<h4>' + esc(p.name) + '</h4>';
      h += '<p>' + esc(p.role || "") + '</p>';
      h += '</div>';
      h += '</div>';
    }
    h += '</div>';
    h += '</div>';
  }
  document.getElementById(elementId).innerHTML = h;
}

function render(data) {
  document.title = data.title || "Семейное древо";
  document.getElementById("eyebrow").textContent = data.eyebrow || "";
  document.getElementById("title").textContent = data.title || "Семейное древо";
  document.getElementById("subtitle").textContent = data.subtitle || "";
  document.getElementById("footer").innerHTML = (data.footer || "").replace(/💜/g, '<span class="heart">💜</span>');

  var center = data.center || {};
  var centerLevel = (center.level !== undefined) ? center.level : 2;
  var groups = Array.isArray(data.groups) ? data.groups : [];
  
  var closePeople = Array.isArray(data.closePeople) ? data.closePeople : [];
  var secondaryPeople = Array.isArray(data.secondaryPeople) ? data.secondaryPeople : [];

  populateSidebar("sidebar", closePeople);
  populateSidebar("sidebar-secondary", secondaryPeople);

  var levels = {};
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    var lv = (g.level !== undefined) ? g.level : 0;
    if (!levels[lv]) levels[lv] = [];
    levels[lv].push(g);
  }
  if (!levels[centerLevel]) levels[centerLevel] = [];
  levels[centerLevel]._hasCenter = true;

  var sortedLevels = Object.keys(levels).sort(function(a,b){return Number(a)-Number(b)});

  var html = '<div class="tree">';
  for (var idx = 0; idx < sortedLevels.length; idx++) {
    var lv = sortedLevels[idx];
    var levelNum = Number(lv);
    if (idx > 0) {
      html += '<div class="connector-h"><div class="hline"></div></div>';
    }
    html += '<div class="level-column">';
    html += '<div class="level-label">' + esc(levelLabelText(levelNum)) + '</div>';
    if (levels[lv]._hasCenter) {
      html += renderCenter(center);
    }
    var lvGroups = levels[lv];
    for (var j = 0; j < lvGroups.length; j++) {
      var g = lvGroups[j];
      var showGenTag = (g.level === centerLevel);
      html += renderGroup(g, String(levelNum), showGenTag);
    }
    html += '</div>';
  }
  html += '</div>';

  document.getElementById("content").innerHTML = html;
}

function loadFamily() {
  var status = document.getElementById("status");
  fetch(JSON_FILE + "?v=" + Date.now(), {cache: "no-store"})
    .then(function(resp) {
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.text();
    })
    .then(function(text) {
      var data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("Ошибка JSON: " + e.message);
      }
      if (text !== lastJSON) {
        render(data);
        lastJSON = text;
        status.innerHTML = '<span class="dot"></span>Синхронизировано: ' + new Date().toLocaleTimeString("ru-RU");
      } else {
        status.innerHTML = '<span class="dot"></span>Актуально: ' + new Date().toLocaleTimeString("ru-RU");
      }
    })
    .catch(function(err) {
      status.innerHTML = '<span class="dot" style="background:#f87171"></span>Ошибка: ' + err.message;
      if (!lastJSON) {
        document.getElementById("content").innerHTML = '<div class="error-box">Ошибка загрузки family.json. Проверь: 1) файл лежит в корне репозитория; 2) в JSON нет ошибок синтаксиса; 3) открыта консоль (F12).</div>';
      }
      console.error(err);
    });
}

loadFamily();
setInterval(loadFamily, REFRESH_MS);

// База данных влюбленных пар (Абсолютно нетронутая логика)
function getPartnerName(name) {
  var pairs = {
    "Diamonita Grand": "EKSOD_GRAND",
    "EKSOD_GRAND": "Diamonita Grand"
  };
  return pairs[name] || null;
}

// Слушатель событий мыши на холсте
document.addEventListener('mouseover', function(e) {
  var personCard = e.target.closest('.person');
  if (!personCard) return;

  var name = personCard.getAttribute('data-name');
  var partnerName = getPartnerName(name);

  if (partnerName) {
    var partnerCard = document.querySelector('.person[data-name="' + partnerName + '"]');
    personCard.classList.add('partner-highlighted');
    if (partnerCard) {
      partnerCard.classList.add('partner-highlighted');
    }
  }
});

document.addEventListener('mouseout', function(e) {
  var personCard = e.target.closest('.person');
  if (!personCard) return;

  var name = personCard.getAttribute('data-name');
  var partnerName = getPartnerName(name);

  if (partnerName) {
    var partnerCard = document.querySelector('.person[data-name="' + partnerName + '"]');
    personCard.classList.remove('partner-highlighted');
    if (partnerCard) {
      partnerCard.classList.remove('partner-highlighted');
    }
  }
});
</script>
</body>
</html>
