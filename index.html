<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейное древо</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128156;</text></svg>">
<style>
:root{--bg1:#0d0a1a;--bg2:#1a1230;--card:rgba(28,21,49,.82);--text:#f5f0ff;--muted:#c4b5d9;--muted2:#a08fb0;--accent:#b07cff;--accent2:#ff79c6;--accent3:#5eead4;--gold:#fcd34d;--border:rgba(188,124,255,.18);--border-bright:rgba(188,124,255,.4);--line:rgba(188,124,255,.3);--shadow:0 12px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:var(--text);font-family:'Segoe UI','Inter',system-ui,sans-serif;background:radial-gradient(ellipse at 15% 8%,rgba(176,124,255,.15),transparent 35%),radial-gradient(ellipse at 85% 25%,rgba(255,121,198,.1),transparent 30%),radial-gradient(ellipse at 50% 90%,rgba(94,234,212,.06),transparent 40%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
.page{max-width:1400px;margin:0 auto;padding:48px 24px 72px}
.hero{text-align:center;margin-bottom:56px}
.eyebrow{display:inline-block;padding:8px 18px;border:1px solid rgba(220,185,255,.22);border-radius:999px;color:#dac4ee;background:rgba(255,255,255,.04);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
h1{margin:16px 0 8px;font-size:clamp(32px,6vw,64px);line-height:1.05;letter-spacing:-.04em;font-weight:800;background:linear-gradient(100deg,#fff,#d8b8ff,#ffacd9);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{max-width:680px;margin:0 auto 20px;color:var(--muted);font-size:16px;line-height:1.65}
.status{margin:16px auto 0;width:fit-content;padding:8px 16px;border-radius:999px;color:var(--muted2);background:rgba(255,255,255,.04);font-size:13px;border:1px solid rgba(255,255,255,.05)}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6ee7b7;margin-right:8px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tree{display:flex;flex-direction:column;align-items:center}
.level-row{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;width:100%;position:relative;margin-bottom:36px}
.level-label{width:100%;text-align:center;margin-bottom:12px;font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2)}
.connector{display:flex;flex-direction:column;align-items:center;width:100%;padding:12px 0;position:relative}
.connector .vline{width:2px;height:44px;background:linear-gradient(to bottom,transparent,var(--line),transparent)}
.connector .parent-note{font-size:14px;color:var(--muted2);margin-top:6px;letter-spacing:.04em}
.center-card{min-width:min(340px,100%);text-align:center;padding:32px;border-radius:24px;border:1px solid var(--border-bright);background:linear-gradient(135deg,rgba(176,124,255,.18),rgba(255,121,198,.08)),rgba(20,15,37,.95);box-shadow:0 20px 60px rgba(176,124,255,.16);position:relative;flex:1 1 340px;max-width:420px}
.center-card::before{content:'';position:absolute;inset:-3px;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));z-index:-1;opacity:.28;filter:blur(12px)}
.center-card .icon{font-size:38px;line-height:1;margin-bottom:10px}
.center-card .name{display:block;font-size:26px;font-weight:800;margin-top:4px;background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.center-card .role{display:block;color:var(--muted);margin-top:6px;font-size:16px;font-style:italic;line-height:1.4}
.group{flex:1 1 340px;max-width:420px;border:1px solid var(--border);border-radius:22px;background:var(--card);backdrop-filter:blur(16px);overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s}
.group:hover{border-color:var(--border-bright);transform:translateY(-4px);box-shadow:var(--shadow)}
.group-head{padding:16px 20px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.group-head h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.group-head .sub{margin-top:6px;color:var(--muted2);font-size:15px;line-height:1.5}
.people{display:flex;flex-direction:column;gap:10px;padding:14px}
.person{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid rgba(255,255,255,.045);border-radius:16px;background:rgba(255,255,255,.03);transition:all .18s}
.person:hover{background:rgba(176,124,255,.07);border-color:rgba(176,124,255,.16)}
.avatar{flex:0 0 42px;width:42px;height:42px;display:grid;place-items:center;border-radius:14px;font-size:20px;background:linear-gradient(135deg,rgba(176,124,255,.2),rgba(255,121,198,.1));border:1px solid rgba(255,255,255,.06)}
.person-info{min-width:0;flex:1}
.person-name{font-weight:700;font-size:16px;overflow-wrap:anywhere;line-height:1.3}
.person-role{margin-top:3px;color:var(--muted2);font-size:14px;line-height:1.35}
.close-section{margin-top:72px}
.close-divider{display:flex;align-items:center;gap:20px;margin:0 auto 36px;max-width:640px}
.close-divider .line{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--border-bright),transparent)}
.close-divider .label{font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.close-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:24px}
.footer{text-align:center;margin-top:60px;padding:28px;color:var(--muted2);font-size:15px;line-height:1.7;border-top:1px solid rgba(255,255,255,.05)}
.footer .heart{color:var(--accent2)}
.error-box{max-width:600px;margin:30px auto;padding:20px;border:1px solid #75405b;border-radius:16px;background:#281421;color:#f0a0b8;text-align:center;font-size:14px;line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.group,.center-card{animation:fadeIn .4s ease-out}
@media(max-width:1000px){.group,.center-card{flex:1 1 300px;max-width:380px}}
@media(max-width:680px){.page{padding:32px 16px 56px}.group,.center-card{flex:1 1 100%;max-width:none}.center-card{padding:24px 20px}.center-card .name{font-size:24px}.group-head h2{font-size:16px}.group-head .sub{font-size:13px}.person-name{font-size:15px}.person-role{font-size:13px}}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="eyebrow" id="eyebrow">Загрузка...</div>
    <h1 id="title">Семейное древо</h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="status" id="status"><span class="dot"></span>Загружаю family.json...</div>
  </header>
  <section id="content"></section>
  <footer class="footer" id="footer"></footer>
</main>
<script>
var JSON_FILE = "./family.json";
var REFRESH_MS = 30000;
var lastJSON = "";

function esc(v) {
  v = v || "";
  v = String(v);
  return v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function levelLabelText(level) {
  var labels = {0:"Старшее поколение",1:"Родители",2:"Наше поколение",3:"Дети и племянники"};
  return labels[level] || ("Уровень " + level);
}

function renderGroup(group, tagClass, tagText) {
  var h = "";
  h += '<article class="group">';
  h += '<div class="group-head">';
  h += '<h2>' + esc(group.title);
  if (tagText) h += ' <span class="group-tag tag-' + tagClass + '">' + esc(tagText) + '</span>';
  h += '</h2>';
  // Увеличили шрифт subtitle до 15px (было 14px)
  h += '<div class="sub">' + esc(group.subtitle || "") + '</div>';
  h += '</div>';
  h += '<div class="people">';
  var ppl = group.people || [];
  for (var i = 0; i < ppl.length; i++) {
    var p = ppl[i];
    h += '<div class="person">';
    h += '<div class="avatar">' + esc(p.icon || "\uD83D\uDC9C") + '</div>';
    h += '<div class="person-info">';
    h += '<div class="person-name">' + esc(p.name) + '</div>';
    h += '<div class="person-role">' + esc(p.role || "") + '</div>';
    h += '</div>';
    h += '</div>';
  }
  h += '</div>';
  h += '</article>';
  return h;
}

function renderCenter(center) {
  var h = '<div class="center-card">';
  h += '<div class="icon">' + esc(center.icon || "\uD83D\uDC9C") + '</div>';
  h += '<span class="name">' + esc(center.name || "Я") + '</span>';
  // Увеличили шрифт role до 16px (было 15px)
  h += '<span class="role">' + esc(center.role || "") + '</span>';
  h += '</div>';
  return h;
}

function render(data) {
  document.title = data.title || "Семейное древо";
  document.getElementById("eyebrow").textContent = data.eyebrow || "";
  document.getElementById("title").textContent = data.title || "Семейное древо";
  document.getElementById("subtitle").textContent = data.subtitle || "";
  document.getElementById("footer").innerHTML = (data.footer || "").replace(/\uD83D\uDC9C/g, '<span class="heart">\uD83D\uDC9C</span>');

  var center = data.center || {};
  var centerLevel = (center.level !== undefined) ? center.level : 2;
  var groups = Array.isArray(data.groups) ? data.groups : [];
  var closePeople = Array.isArray(data.closePeople) ? data.closePeople : [];

  var levels = {};
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    var lv = (g.level !== undefined) ? g.level : 0;
    if (!levels[lv]) levels[lv] = [];
    levels[lv].push(g);
  }
  if (!levels[centerLevel]) levels[centerLevel] = [];
  levels[centerLevel]._hasCenter = true;

  var sortedLevels = Object.keys(levels).sort(function(a,b){return Number(a)-Number(b)});

  var html = '<div class="tree">';
  for (var idx = 0; idx < sortedLevels.length; idx++) {
    var lv = sortedLevels[idx];
    var levelNum = Number(lv);
    if (idx > 0) {
      html += '<div class="connector"><div class="vline"></div></div>';
    }
    html += '<div class="level-row">';
    html += '<div class="level-label">' + esc(levelLabelText(levelNum)) + '</div>';
    if (levels[lv]._hasCenter) {
      html += renderCenter(center);
    }
    var lvGroups = levels[lv];
    for (var j = 0; j < lvGroups.length; j++) {
      html += renderGroup(lvGroups[j], String(levelNum), levelLabelText(levelNum));
    }
    html += '</div>';
  }
  html += '</div>';

  // Блок "Племянники и племянницы" теперь всегда отдельный, без метки поколения
  if (closePeople.length > 0) {
    html += '<div class="close-section">';
    html += '<div class="close-divider"><div class="line"></div><span class="label">Племянники и племянницы</span><div class="line"></div></div>';
    html += '<div class="close-grid">';
    for (var k = 0; k < closePeople.length; k++) {
      // Передаем null вместо тега поколения, чтобы не рисовался "Наше поколение"
      html += renderGroup(closePeople[k], "special", null);
    }
    html += '</div></div>';
  }

  document.getElementById("content").innerHTML = html;
}

function loadFamily() {
  var status = document.getElementById("status");
  fetch(JSON_FILE + "?v=" + Date.now(), {cache: "no-store"})
    .then(function(resp) {
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.text();
    })
    .then(function(text) {
      var data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("Ошибка JSON: " + e.message);
      }
      if (text !== lastJSON) {
        render(data);
        lastJSON = text;
        status.innerHTML = '<span class="dot"></span>Обновлено: ' + new Date().toLocaleTimeString("ru-RU");
      } else {
        status.innerHTML = '<span class="dot"></span>Проверено: ' + new Date().toLocaleTimeString("ru-RU");
      }
    })
    .catch(function(err) {
      status.innerHTML = '<span class="dot" style="background:#f87171"></span>Ошибка: ' + err.message;
      if (!lastJSON) {
        document.getElementById("content").innerHTML = '<div class="error-box">Ошибка загрузки family.json. Проверь: 1) файл лежит в корне репозитория; 2) в JSON нет ошибок синтаксиса; 3) открой консоль (F12).</div>';
      }
      console.error(err);
    });
}

loadFamily();
setInterval(loadFamily, REFRESH_MS);
</script>
</body>
</html>
