<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейное древо</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>">
<style>
:root {
  --bg-dark: #0f0a1a;
  --bg-panel: rgba(22, 18, 36, 0.88);
  --accent-1: #7c3aed;
  --accent-2: #ec4899;
  --accent-3: #10b981;
  --text-main: #ffffff;
  --text-muted: #a18cb4;
  --border-inner: rgba(124, 58, 237, 0.6);
  --border-outer: rgba(255, 255, 255, 0.08);
  --glow: 0 0 12px rgba(124, 58, 237, 0.36);
  --line-color: rgba(255, 255, 255, 0.18);
  --line-grad: linear-gradient(to bottom, transparent, rgba(124, 58, 237, 0.24), transparent);
  --card-radius: 14px;
  --transition-fast: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  margin: 0;
  color: var(--text-main);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.12) 0%, transparent 35%),
              radial-gradient(circle at 85% 15%, rgba(236, 72, 153, 0.1) 0%, transparent 30%),
              linear-gradient(160deg, var(--bg-dark), #140e26);
  background-attachment: fixed;
  overflow-x: hidden;
}
.layout-grid {
  display: grid;
  grid-template-columns: 320px 320px 1fr;
  min-height: 100vh;
  max-width: 1920px;
  margin: 0 auto;
}

.sidebar {
  padding: 40px 20px;
  background: rgba(0, 0, 0, 0.4);
  border-right: 1px solid rgba(255, 255, 255, 0.05);
  overflow-y: auto;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.sidebar-secondary {
  padding: 40px 20px;
  background: rgba(0, 0, 0, 0.2);
  border-right: 1px solid rgba(255, 255, 255, 0.05);
  overflow-y: auto;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.section-title {
  font-size: 18px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent-2);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
}

.section-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 16px;
  line-height: 1.4;
}

.card-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sidebar-card {
  background: var(--bg-panel);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: var(--transition-fast);
}

.sidebar-card:hover {
  transform: translateX(4px);
  border-color: var(--accent-1);
  box-shadow: var(--glow);
}

.avatar-small {
  flex: 0 0 36px;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 20px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
}

.info-small h4 {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
}

.info-small p {
  font-size: 12px;
  color: var(--text-muted);
}

.main-content {
  padding: 40px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.hero {
  text-align: center;
  margin-bottom: 48px;
  width: 100%;
}

.eyebrow {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
}

h1 {
  margin: 12px 0 6px;
  font-size: clamp(28px, 5vw, 56px);
  line-height: 1.05;
  font-weight: 800;
  background: linear-gradient(100deg, #fff, #c4b5e0, #ffdbeb);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 16px rgba(124, 58, 237, 0.24);
}

.subtitle {
  max-width: 640px;
  margin: 0 auto 16px;
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.6;
}

.status {
  margin: 12px auto 0;
  width: fit-content;
  padding: 6px 12px;
  border-radius: 999px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.03);
  font-size: 12px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.status .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-3);
  margin-right: 6px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.tree {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.level-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 24px;
  width: 100%;
  position: relative;
  margin-bottom: 32px;
}

.level-label {
  width: 100%;
  text-align: center;
  margin-bottom: 10px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-shadow: 0 0 8px rgba(124, 58, 237, 0.18);
}

.connector {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 10px 0;
  position: relative;
}

.connector .vline {
  width: 2px;
  height: 36px;
  background: var(--line-grad);
}

.center-card {
  min-width: min(320px, 100%);
  text-align: center;
  padding: 28px;
  border-radius: 20px;
  border: 1px solid var(--border-inner);
  background: var(--bg-panel);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.42), var(--glow);
  position: relative;
  flex: 1 1 320px;
  max-width: 400px;
  backdrop-filter: blur(12px);
  transition: var(--transition-fast);
}

.center-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(124, 58, 237, 0.6);
}

.center-card::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
  z-index: -1;
  opacity: 0.16;
  filter: blur(10px);
}

.center-card .icon {
  font-size: 34px;
  line-height: 1;
  margin-bottom: 8px;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.36));
}

.center-card .name {
  display: block;
  font-size: 24px;
  font-weight: 800;
  margin-top: 4px;
  background: linear-gradient(100deg, var(--accent-1), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1.1;
  text-shadow: 0 0 12px rgba(124, 58, 237, 0.32);
}

.center-card .role {
  display: block;
  color: var(--text-muted);
  margin-top: 6px;
  font-size: 15px;
  font-style: italic;
  line-height: 1.4;
}

.group {
  flex: 1 1 320px;
  max-width: 400px;
  border: 1px solid var(--border-outer);
  border-radius: 18px;
  background: var(--bg-panel);
  backdrop-filter: blur(10px);
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.group:hover {
  transform: translateY(-4px);
  border-color: var(--border-inner);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.36), var(--glow);
}

.group-head {
  padding: 14px 18px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.group-head h2 {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  color: var(--text-main);
  text-shadow: 0 0 8px rgba(124, 58, 237, 0.2);
}

.group-head .sub {
  margin-top: 6px;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.4;
}

.people {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
}

.person {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: var(--card-radius);
  background: rgba(255, 255, 255, 0.02);
  transition: var(--transition-fast);
}

.person:hover, .person.partner-highlighted {
  background: rgba(124, 58, 237, 0.12) !important;
  border-color: rgba(124, 58, 237, 0.6) !important;
  box-shadow: var(--glow) !important;
}

.avatar {
  flex: 0 0 38px;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  font-size: 18px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-main);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.24);
}

.person-info {
  min-width: 0;
  flex: 1;
}

.person-name {
  font-weight: 600;
  font-size: 15px;
  overflow-wrap: anywhere;
  line-height: 1.3;
  color: var(--text-main);
}

.person-role {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.3;
}

.final-quote {
  margin-top: 60px;
  text-align: center;
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.6;
  max-width: 600px;
}

.heart {
  color: #a855f7;
  display: inline-block;
}

.error-box {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 12px;
  padding: 20px;
  color: #fca5a5;
  text-align: center;
  max-width: 500px;
  margin: 20px auto;
}

@media (max-width: 1200px) {
  .layout-grid {
    grid-template-columns: 1fr;
  }
  .sidebar, .sidebar-secondary {
    height: auto;
    position: relative;
    border-right: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
}
</style>
</head>
<body>
<main class="layout-grid">
  <!-- Левая панель для близкого круга -->
  <aside class="sidebar" id="sidebar"></aside>
  
  <!-- Правая панель для ролевого окружения -->
  <aside class="sidebar-secondary" id="sidebar-secondary"></aside>

  <!-- Центральная контентная зона -->
  <div class="main-content">
    <header class="hero">
      <div class="eyebrow" id="eyebrow">Загрузка...</div>
      <h1 id="title">Семейное древо</h1>
      <p class="subtitle" id="subtitle"></p>
      <div class="status" id="status"><span class="dot"></span>Загружаю family.json...</div>
    </header>

    <!-- Сюда JavaScript вставит динамические уровни поколений -->
    <section id="content"></section>
    
    <!-- Финальная цитата -->
    <footer class="final-quote" id="footer"></footer>
  </div>
</main>
<script>
var JSON_FILE = "family.json";
var REFRESH_MS = 30000;
var lastJSON = "";

// Исправлено экранирование спецсимволов для безопасности (XSS Protection)
function esc(v) {
  if (!v) return "";
  return String(v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function levelLabelText(level) {
  var labels = {0: "Старшее поколение", 1: "Родители", 2: "Дети своих родителей", 4: "Племянники и племянницы", 3: "Мои Дети"};
  return labels[level] || ("Уровень " + level);
}

function renderGroup(group, tagClass, showGenTag) {
  var h = "";
  h += '<article class="group">';
  h += '<div class="group-head">';
  h += '<h2>' + esc(group.title) + '</h2>';
  h += '<div class="sub">' + esc(group.subtitle || "") + '</div>';
  h += '</div>';
  h += '<div class="people">';
  var ppl = group.people || [];
  for (var i = 0; i < ppl.length; i++) {
    var p = ppl[i];
    h += '<div class="person" data-name="' + esc(p.name) + '">';
    h += '<div class="avatar">' + esc(p.icon || "💜") + '</div>';
    h += '<div class="person-info">';
    h += '<div class="person-name">' + esc(p.name) + '</div>';
    h += '<div class="person-role">' + esc(p.role || "") + '</div>';
    h += '</div>';
    h += '</div>';
  }
  h += '</div>';
  h += '</article>';
  return h;
}

function renderCenter(center) {
  var h = '<div class="center-card">';
  h += '<div class="icon">' + esc(center.icon || "💜") + '</div>';
  h += '<span class="name">' + esc(center.name || "Я") + '</span>';
  h += '<span class="role">' + esc(center.role || "") + '</span>';
  h += '</div>';
  return h;
}

function populateSidebar(elementId, dataArray) {
  var h = "";
  for (var i = 0; i < dataArray.length; i++) {
    var section = dataArray[i];
    h += '<div class="section-block">';
    h += '<div class="section-title">' + esc(section.title || "") + '</div>';
    h += '<p class="section-desc">' + esc(section.subtitle || "") + '</p>';
    h += '<div class="card-list">';
    var ppl = section.people || [];
    for (var j = 0; j < ppl.length; j++) {
      var p = ppl[j];
      h += '<div class="sidebar-card">';
      h += '<div class="avatar-small">' + esc(p.icon || "💜") + '</div>';
      h += '<div class="info-small">';
      h += '<h4>' + esc(p.name) + '</h4>';
      h += '<p>' + esc(p.role || "") + '</p>';
      h += '</div>';
      h += '</div>';
    }
    h += '</div>';
    h += '</div>';
  }
  document.getElementById(elementId).innerHTML = h;
}

function render(data) {
  document.title = data.title || "Семейное древо";
  document.getElementById("eyebrow").textContent = data.eyebrow || "";
  document.getElementById("title").textContent = data.title || "Семейное древо";
  document.getElementById("subtitle").textContent = data.subtitle || "";
  document.getElementById("footer").innerHTML = (data.footer || "").replace(/💜/g, '<span class="heart">💜</span>');

  var center = data.center || {};
  var centerLevel = (center.level !== undefined) ? center.level : 2;
  var groups = Array.isArray(data.groups) ? data.groups : [];
  
  var closePeople = Array.isArray(data.closePeople) ? data.closePeople : [];
  var secondaryPeople = Array.isArray(data.secondaryPeople) ? data.secondaryPeople : [];

  populateSidebar("sidebar", closePeople);
  populateSidebar("sidebar-secondary", secondaryPeople);

  var levels = {};
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    var lv = (g.level !== undefined) ? g.level : 0;
    if (!levels[lv]) levels[lv] = [];
    levels[lv].push(g);
  }
  if (!levels[centerLevel]) levels[centerLevel] = [];
  levels[centerLevel]._hasCenter = true;

  var sortedLevels = Object.keys(levels).sort(function(a,b){return Number(a)-Number(b)});

  var html = '<div class="tree">';
  for (var idx = 0; idx < sortedLevels.length; idx++) {
    var lv = sortedLevels[idx];
    var levelNum = Number(lv);
    if (idx > 0) {
      html += '<div class="connector"><div class="vline"></div></div>';
    }
    html += '<div class="level-row">';
    html += '<div class="level-label">' + esc(levelLabelText(levelNum)) + '</div>';
    if (levels[lv]._hasCenter) {
      html += renderCenter(center);
    }
    var lvGroups = levels[lv];
    for (var j = 0; j < lvGroups.length; j++) {
      var g = lvGroups[j];
      var showGenTag = (g.level === centerLevel);
      html += renderGroup(g, String(levelNum), showGenTag);
    }
    html += '</div>';
  }
  html += '</div>';

  document.getElementById("content").innerHTML = html;
}

function loadFamily() {
  var status = document.getElementById("status");
  fetch(JSON_FILE + "?v=" + Date.now(), {cache: "no-store"})
    .then(function(resp) {
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.text();
    })
    .then(function(text) {
      var data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("Ошибка JSON: " + e.message);
      }
      if (text !== lastJSON) {
        render(data);
        lastJSON = text;
        status.innerHTML = '<span class="dot"></span>Обновлено: ' + new Date().toLocaleTimeString("ru-RU");
      } else {
        status.innerHTML = '<span class="dot"></span>Проверено: ' + new Date().toLocaleTimeString("ru-RU");
      }
    })
    .catch(function(err) {
      status.innerHTML = '<span class="dot" style="background:#f87171"></span>Ошибка: ' + err.message;
      if (!lastJSON) {
        document.getElementById("content").innerHTML = '<div class="error-box">Ошибка загрузки family.json. Проверь: 1) файл лежит в корне репозитория; 2) в JSON нет ошибок синтаксиса; 3) открой консоль (F12).</div>';
      }
      console.error(err);
    });
}

loadFamily();
setInterval(loadFamily, REFRESH_MS);

// Оптимизированная и безопасная логика взаимной подсветки через добавление классов
function getPartnerName(name) {
  var pairs = {
    "Diamonita Grand": "EKSOD_GRAND",
    "EKSOD_GRAND": "Diamonita Grand"
  };
  return pairs[name] || null;
}

document.addEventListener('mouseover', function(e) {
  var personCard = e.target.closest('.person');
  if (!personCard) return;

  var name = personCard.getAttribute('data-name');
  var partnerName = getPartnerName(name);

  if (partnerName) {
    var partnerCard = document.querySelector('.person[data-name="' + partnerName + '"]');
    personCard.classList.add('partner-highlighted');
    if (partnerCard) {
      partnerCard.classList.add('partner-highlighted');
    }
  }
});

document.addEventListener('mouseout', function(e) {
  var personCard = e.target.closest('.person');
  if (!personCard) return;

  var name = personCard.getAttribute('data-name');
  var partnerName = getPartnerName(name);

  if (partnerName) {
    var partnerCard = document.querySelector('.person[data-name="' + partnerName + '"]');
    personCard.classList.remove('partner-highlighted');
    if (partnerCard) {
      partnerCard.classList.remove('partner-highlighted');
    }
  }
});
</script>
</body>
</html>
