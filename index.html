<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейное древо — Хроники Хаоса</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #07040d;
  --bg-panel: rgba(15, 11, 28, 0.75);
  --accent-1: #8b5cf6;
  --accent-2: #ec4899;
  --accent-3: #10b981;
  --text-main: #f3f1f6;
  --text-muted: #a79cb5;
  --border-inner: rgba(139, 92, 246, 0.5);
  --border-outer: rgba(255, 255, 255, 0.04);
  --glow: 0 0 20px rgba(139, 92, 246, 0.25);
  --glow-partner: 0 0 25px rgba(236, 72, 153, 0.45);
  --line-grad: linear-gradient(to bottom, transparent, rgba(139, 92, 246, 0.3), transparent);
  --card-radius: 16px;
  --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: #000;
  background-attachment: fixed;
  overflow-x: hidden;
  position: relative;
}

/* Динамический живой фон с неоновыми сферами */
.bg-blobs {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  background: radial-gradient(circle at 50% 50%, #0c0817 0%, var(--bg-dark) 100%);
}
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(140px);
  opacity: 0.18;
  animation: floatBlobs 20s infinite alternate ease-in-out;
}
.blob-1 { top: 10%; left: 10%; width: 450px; height: 450px; background: var(--accent-1); }
.blob-2 { bottom: 15%; right: 10%; width: 500px; height: 500px; background: var(--accent-2); animation-delay: -5s; }

@keyframes floatBlobs {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(50px, 40px) scale(1.15); }
}
.layout-grid {
  display: grid;
  grid-template-columns: 340px 340px 1fr;
  min-height: 100vh;
  max-width: 1920px;
  margin: 0 auto;
  position: relative;
}

/* Стилизация премиальных сайдбаров */
.sidebar, .sidebar-secondary {
  padding: 40px 24px;
  background: rgba(4, 2, 8, 0.45);
  border-right: 1px solid rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  overflow-y: auto;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 36px;
}

.sidebar-secondary {
  background: rgba(4, 2, 8, 0.25);
}

/* Кастомный футуристичный скроллбар */
.sidebar::-webkit-scrollbar, .sidebar-secondary::-webkit-scrollbar {
  width: 5px;
}
.sidebar::-webkit-scrollbar-track, .sidebar-secondary::-webkit-scrollbar-track {
  background: transparent;
}
.sidebar::-webkit-scrollbar-thumb, .sidebar-secondary::-webkit-scrollbar-thumb {
  background: rgba(139, 92, 246, 0);
  border-radius: 99px;
  transition: var(--transition-smooth);
}
.sidebar:hover::-webkit-scrollbar-thumb, .sidebar-secondary:hover::-webkit-scrollbar-thumb {
  background: rgba(139, 92, 246, 0.35);
}
.sidebar::-webkit-scrollbar-thumb:hover, .sidebar-secondary::-webkit-scrollbar-thumb:hover {
  background: var(--accent-1);
}

.section-block {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.section-title {
  font-size: 15px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent-2);
  display: flex;
  align-items: center;
  gap: 10px;
  text-shadow: 0 0 15px rgba(236, 72, 153, 0.35);
}

.section-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
  padding-left: 2px;
}

.card-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sidebar-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-outer);
  border-radius: var(--card-radius);
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: var(--transition-smooth);
}

.sidebar-card:hover {
  transform: translateX(6px) scale(1.01);
  border-color: rgba(139, 92, 246, 0.4);
  box-shadow: var(--glow);
  background: rgba(22, 16, 41, 0.85);
}

.avatar-small {
  flex: 0 0 40px;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 22px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.info-small h4 {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.3px;
}

.info-small p {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.main-content {
  padding: 60px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-y: auto;
}

.hero {
  text-align: center;
  margin-bottom: 54px;
  width: 100%;
}

.eyebrow {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(236, 72, 153, 0.15));
  border: 1px solid rgba(139, 92, 246, 0.25);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 700;
  box-shadow: 0 4px 15px rgba(139, 92, 246, 0.1);
}

h1 {
  margin: 18px 0 10px;
  font-size: clamp(32px, 4.5vw, 52px);
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #ffffff 30%, #e2d9f3 70%, #ffd6eb 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
}

.subtitle {
  max-width: 600px;
  margin: 0 auto 20px;
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.6;
}

.status {
  margin: 14px auto 0;
  width: fit-content;
  padding: 6px 16px;
  border-radius: 999px;
  color: #fff;
  background: rgba(16, 185, 129, 0.06);
  font-size: 12px;
  font-weight: 500;
  border: 1px solid rgba(16, 185, 129, 0.25);
  backdrop-filter: blur(5px);
  display: flex;
  align-items: center;
  gap: 8px;
}

.status .dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-3);
  box-shadow: 0 0 10px var(--accent-3);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.9); }
}

.tree {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.level-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 28px;
  width: 100%;
  position: relative;
  margin-bottom: 40px;
}

.level-label {
  width: 100%;
  text-align: center;
  margin-bottom: 14px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
  opacity: 0.8;
}

.connector {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 12px 0;
  position: relative;
}

.connector .vline {
  width: 2px;
  height: 40px;
  background: var(--line-grad);
}

.center-card {
  min-width: min(330px, 100%);
  text-align: center;
  padding: 32px 24px;
  border-radius: 24px;
  border: 1px solid var(--border-inner);
  background: rgba(20, 13, 38, 0.85);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), var(--glow);
  position: relative;
  flex: 1 1 330px;
  max-width: 420px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: var(--transition-smooth);
}

.center-card:hover {
  transform: translateY(-6px);
  border-color: #a78bfa;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(139, 92, 246, 0.5);
}

.center-card::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 24px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  z-index: -1;
  opacity: 0.3;
}

.center-card .icon {
  font-size: 38px;
  line-height: 1;
  margin-bottom: 12px;
  filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.4));
  transition: transform 0.3s ease;
}
.center-card:hover .icon {
  transform: scale(1.15) rotate(5deg);
}

.center-card .name {
  display: block;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.3px;
  background: linear-gradient(135deg, #fff 0%, #c4b5e0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1.2;
}

.center-card .role {
  display: block;
  color: var(--accent-2);
  margin-top: 8px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.2px;
}

.group {
  flex: 1 1 330px;
  max-width: 420px;
  border: 1px solid var(--border-outer);
  border-radius: 20px;
  background: var(--bg-panel);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  overflow: hidden;
  transition: var(--transition-smooth);
}

.group:hover {
  transform: translateY(-5px);
  border-color: rgba(255, 255, 255, 0.12);
  box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
}

.group-head {
  padding: 18px 20px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  background: rgba(255, 255, 255, 0.01);
}

.group-head h2 {
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  letter-spacing: 0.3px;
}

.group-head .sub {
  margin-top: 6px;
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.5;
}

.people {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
}

.person {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(255, 255, 255, 0.02);
  border-radius: var(--card-radius);
  background: rgba(255, 255, 255, 0.01);
  transition: var(--transition-smooth);
}

.person:hover {
  background: rgba(139, 92, 246, 0.06);
  border-color: rgba(139, 92, 246, 0.2);
  transform: translateX(4px);
}

/* Эффект взаимной подсветки влюбленных пар без багов */
.person.partner-highlighted {
  background: rgba(236, 72, 153, 0.09) !important;
  border-color: rgba(236, 72, 153, 0.5) !important;
  box-shadow: var(--glow-partner) !important;
  transform: scale(1.03) translateY(-2px);
}

.avatar {
  flex: 0 0 40px;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  font-size: 20px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  transition: transform 0.2s;
}
.person:hover .avatar {
  transform: scale(1.1);
}

.person-info {
  min-width: 0;
  flex: 1;
}

.person-name {
  font-weight: 600;
  font-size: 14px;
  overflow-wrap: anywhere;
  line-height: 1.4;
  color: #fff;
  letter-spacing: 0.2px;
}

.person-role {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 12px;
  line-height: 1.3;
}

.final-quote {
  margin-top: 70px;
  text-align: center;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.7;
  max-width: 580px;
  padding: 24px;
  border-top: 1px solid rgba(255, 255, 255, 0.04);
}

@media (max-width: 1300px) {
  .layout-grid { grid-template-columns: 300px 300px 1fr; }
}

@media (max-width: 1200px) {
  .layout-grid { grid-template-columns: 1fr; }
  .sidebar, .sidebar-secondary {
    height: auto;
    position: relative;
    border-right: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .main-content { padding: 40px 20px; }
}
</style>
</head>
<body>

<!-- Динамические неоновые сферы на фоне приложения -->
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<main class="layout-grid">
  <!-- Левый сайдбар: Близкий круг и Питомцы -->
  <aside class="sidebar" id="sidebar"></aside>
  
  <!-- Правый сайдбар: Окружение и Инфраструктура -->
  <aside class="sidebar-secondary" id="sidebar-secondary"></aside>

  <!-- Центральная область с интерактивным древом поколений -->
  <div class="main-content">
    <header class="hero">
      <div class="eyebrow" id="eyebrow">Синхронизация...</div>
      <h1 id="title">Семейное древо</h1>
      <p class="subtitle" id="subtitle"></p>
      <div class="status" id="status"><span class="dot"></span>Подключение к family.json...</div>
    </header>

    <!-- Секция для динамической генерации древа -->
    <section id="content"></section>
    
    <!-- Хроники тепла -->
    <footer class="final-quote" id="footer"></footer>
  </div>
</main>
<script>
var JSON_FILE = "family.json";
var REFRESH_MS = 30000;
var lastJSON = "";

// Функция безопасного экранирования спецсимволов (Защита от XSS-уязвимостей)
function esc(v) {
  if (!v) return "";
  return String(v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function levelLabelText(level) {
  var labels = {0: "Старшее поколение", 1: "Родители", 2: "Дети своих родителей", 4: "Племянники и племянницы", 3: "Мои Дети"};
  return labels[level] || ("Уровень " + level);
}

function renderGroup(group, tagClass, showGenTag) {
  var h = "";
  h += '<article class="group">';
  h += '<div class="group-head">';
  h += '<h2>' + esc(group.title) + '</h2>';
  h += '<div class="sub">' + esc(group.subtitle || "") + '</div>';
  h += '</div>';
  h += '<div class="people">';
  var ppl = group.people || [];
  for (var i = 0; i < ppl.length; i++) {
    var p = ppl[i];
    h += '<div class="person" data-name="' + esc(p.name) + '">';
    h += '<div class="avatar">' + esc(p.icon || "💜") + '</div>';
    h += '<div class="person-info">';
    h += '<div class="person-name">' + esc(p.name) + '</div>';
    h += '<div class="person-role">' + esc(p.role || "") + '</div>';
    h += '</div>';
    h += '</div>';
  }
  h += '</div>';
  h += '</article>';
  return h;
}

function renderCenter(center) {
  var h = '<div class="center-card">';
  h += '<div class="icon">' + esc(center.icon || "💜") + '</div>';
  h += '<span class="name">' + esc(center.name || "Я") + '</span>';
  h += '<span class="role">' + esc(center.role || "") + '</span>';
  h += '</div>';
  return h;
}

function populateSidebar(elementId, dataArray) {
  var h = "";
  for (var i = 0; i < dataArray.length; i++) {
    var section = dataArray[i];
    h += '<div class="section-block">';
    h += '<div class="section-title">' + esc(section.title || "") + '</div>';
    h += '<p class="section-desc">' + esc(section.subtitle || "") + '</p>';
    h += '<div class="card-list">';
    var ppl = section.people || [];
    for (var j = 0; j < ppl.length; j++) {
      var p = ppl[j];
      h += '<div class="sidebar-card">';
      h += '<div class="avatar-small">' + esc(p.icon || "💜") + '</div>';
      h += '<div class="info-small">';
      h += '<h4>' + esc(p.name) + '</h4>';
      h += '<p>' + esc(p.role || "") + '</p>';
      h += '</div>';
      h += '</div>';
    }
    h += '</div>';
    h += '</div>';
  }
  document.getElementById(elementId).innerHTML = h;
}

function render(data) {
  document.title = data.title || "Семейное древо";
  document.getElementById("eyebrow").textContent = data.eyebrow || "";
  document.getElementById("title").textContent = data.title || "Семейное древо";
  document.getElementById("subtitle").textContent = data.subtitle || "";
  document.getElementById("footer").innerHTML = (data.footer || "").replace(/💜/g, '<span class="heart">💜</span>');

  var center = data.center || {};
  var centerLevel = (center.level !== undefined) ? center.level : 2;
  var groups = Array.isArray(data.groups) ? data.groups : [];
  
  var closePeople = Array.isArray(data.closePeople) ? data.closePeople : [];
  var secondaryPeople = Array.isArray(data.secondaryPeople) ? data.secondaryPeople : [];

  populateSidebar("sidebar", closePeople);
  populateSidebar("sidebar-secondary", secondaryPeople);

  var levels = {};
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    var lv = (g.level !== undefined) ? g.level : 0;
    if (!levels[lv]) levels[lv] = [];
    levels[lv].push(g);
  }
  if (!levels[centerLevel]) levels[centerLevel] = [];
  levels[centerLevel]._hasCenter = true;

  var sortedLevels = Object.keys(levels).sort(function(a,b){return Number(a)-Number(b)});

  var html = '<div class="tree">';
  for (var idx = 0; idx < sortedLevels.length; idx++) {
    var lv = sortedLevels[idx];
    var levelNum = Number(lv);
    if (idx > 0) {
      html += '<div class="connector"><div class="vline"></div></div>';
    }
    html += '<div class="level-row">';
    html += '<div class="level-label">' + esc(levelLabelText(levelNum)) + '</div>';
    if (levels[lv]._hasCenter) {
      html += renderCenter(center);
    }
    var lvGroups = levels[lv];
    for (var j = 0; j < lvGroups.length; j++) {
      var g = lvGroups[j];
      var showGenTag = (g.level === centerLevel);
      html += renderGroup(g, String(levelNum), showGenTag);
    }
    html += '</div>';
  }
  html += '</div>';

  document.getElementById("content").innerHTML = html;
}

function loadFamily() {
  var status = document.getElementById("status");
  fetch(JSON_FILE + "?v=" + Date.now(), {cache: "no-store"})
    .then(function(resp) {
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.text();
    })
    .then(function(text) {
      var data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("Ошибка JSON: " + e.message);
      }
      if (text !== lastJSON) {
        render(data);
        lastJSON = text;
        status.innerHTML = '<span class="dot"></span>Обновлено: ' + new Date().toLocaleTimeString("ru-RU");
      } else {
        status.innerHTML = '<span class="dot"></span>Проверено: ' + new Date().toLocaleTimeString("ru-RU");
      }
    })
    .catch(function(err) {
      status.innerHTML = '<span class="dot" style="background:#f87171"></span>Ошибка: ' + err.message;
      if (!lastJSON) {
        document.getElementById("content").innerHTML = '<div class="error-box">Ошибка загрузки family.json. Проверь: 1) файл лежит в книге репозитория; 2) в JSON нет ошибок синтаксиса; 3) открыта консоль (F12).</div>';
      }
      console.error(err);
    });
}

loadFamily();
setInterval(loadFamily, REFRESH_MS);

// Изолированная декларативная база данных влюбленных пар
function getPartnerName(name) {
  var pairs = {
    "Diamonita Grand": "EKSOD_GRAND",
    "EKSOD_GRAND": "Diamonita Grand"
  };
  return pairs[name] || null;
}

// Перехват событий наведения мыши для взаимного подсвечивания влюбленных пар
document.addEventListener('mouseover', function(e) {
  var personCard = e.target.closest('.person');
  if (!personCard) return;

  var name = personCard.getAttribute('data-name');
  var partnerName = getPartnerName(name);

  if (partnerName) {
    var partnerCard = document.querySelector('.person[data-name="' + partnerName + '"]');
    personCard.classList.add('partner-highlighted');
    if (partnerCard) {
      partnerCard.classList.add('partner-highlighted');
    }
  }
});

// Сброс классов подсветки при уходе курсора
document.addEventListener('mouseout', function(e) {
  var personCard = e.target.closest('.person');
  if (!personCard) return;

  var name = personCard.getAttribute('data-name');
  var partnerName = getPartnerName(name);

  if (partnerName) {
    var partnerCard = document.querySelector('.person[data-name="' + partnerName + '"]');
    personCard.classList.remove('partner-highlighted');
    if (partnerCard) {
      partnerCard.classList.remove('partner-highlighted');
    }
  }
});
</script>
