<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейное древо — Хроники Экосистемы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #05020a;
  --bg-panel: rgba(17, 11, 31, 0.88);
  --accent-1: #b55ffc; /* Аметистовая орхидея */
  --accent-2: #ec4899; /* Розовый неон для пар */
  --accent-3: #475569;
  --text-main: #fcfaff;
  --text-muted: #b4abbf;
  --border-inner: rgba(181, 95, 252, 0.45);
  --border-outer: rgba(255, 255, 255, 0.04);
  --glow: 0 0 30px rgba(181, 95, 252, 0.25);
  --glow-partner: 0 0 30px rgba(236, 72, 153, 0.65);
  --line-grad: linear-gradient(to bottom, transparent, rgba(181, 95, 252, 0.4), transparent);
  --card-radius: 16px;
  --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Стили для полного отключения анимаций на слабом ПК */
body.perf-mode {
  --glow: none !important;
  --glow-partner: none !important;
  --transition-smooth: none !important;
}
body.perf-mode .blob {
  display: none !important;
}
body.perf-mode .bg-canvas {
  animation: none !important;
  opacity: 0.5 !important;
}
body.perf-mode .sidebar, 
body.perf-mode .sidebar-secondary, 
body.perf-mode .group, 
body.perf-mode .center-card, 
body.perf-mode .search-input,
body.perf-mode .analytics-widget {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  background: #110b1f !important;
}
body.perf-mode .person:hover {
  transform: none !important;
}
body.perf-mode .center-card:hover, 
body.perf-mode .group:hover {
  transform: none !important;
  box-shadow: none !important;
  border-color: var(--border-inner) !important;
}
body.perf-mode .modal-avatar {
  animation: none !important;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  margin: 0;
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: #000;
  background-attachment: fixed;
  overflow-x: hidden;
  position: relative;
}
/* Гарантированный звездный фон с точными пиксельными размерами */
.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: -2;
  background-color: var(--bg-dark);
  background-image: 
    radial-gradient(circle, rgba(255, 255, 255, 0.3) 1.5px, transparent 1.5px),
    radial-gradient(circle, rgba(181, 95, 252, 0.25) 2.5px, transparent 2.5px),
    radial-gradient(circle, rgba(255, 255, 255, 0.2) 2px, transparent 2px);
  background-size: 50px 50px, 110px 110px, 150px 130px;
  background-position: 0 0, 25px 30px, 70px 60px;
  pointer-events: none;
  animation: spaceGlow 20s infinite alternate ease-in-out;
}

@keyframes spaceGlow {
  0% { opacity: 0.8; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.02); }
  100% { opacity: 0.85; transform: scale(0.99); }
}

.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(160px);
  opacity: 0.14;
  pointer-events: none;
  z-index: -2;
  animation: floatBlobs 26s infinite alternate ease-in-out;
}
.blob-1 { top: 12%; left: 6%; width: 550px; height: 550px; background: var(--accent-1); }
.blob-2 { bottom: 15%; right: 6%; width: 600px; height: 600px; background: #6323a6; animation-delay: -6s; }

@keyframes floatBlobs {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(45px, 35px) scale(1.12); }
}

/* Переключатель режима экономии ресурсов в левом верхнем углу */
.perf-toggle {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 1500;
  background: var(--bg-panel);
  border: 1px solid var(--border-inner);
  color: var(--text-main);
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--glow);
  display: flex;
  align-items: center;
  gap: 6px;
  transition: var(--transition-smooth);
}
.perf-toggle:hover {
  background: var(--accent-1);
  transform: translateY(-2px);
}

.layout-grid {
  display: grid;
  grid-template-columns: minmax(300px, 350px) 1fr minmax(300px, 350px);
  min-height: 100vh;
  max-width: 1920px;
  margin: 0 auto;
}

.sidebar, .sidebar-secondary {
  padding: 40px 18px;
  background: rgba(5, 3, 13, 0.7);
  border-right: 1px solid rgba(181, 95, 252, 0.06);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  overflow-y: auto;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.sidebar-secondary {
  background: rgba(5, 3, 13, 0.55);
  border-right: none;
  border-left: 1px solid rgba(181, 95, 252, 0.06);
}

.sidebar::-webkit-scrollbar, .sidebar-secondary::-webkit-scrollbar {
  width: 4px;
}
.sidebar::-webkit-scrollbar-track, .sidebar-secondary::-webkit-scrollbar-track {
  background: transparent;
}
.sidebar::-webkit-scrollbar-thumb, .sidebar-secondary::-webkit-scrollbar-thumb {
  background: rgba(181, 95, 252, 0);
  border-radius: 99px;
  transition: var(--transition-smooth);
}
.sidebar:hover::-webkit-scrollbar-thumb, .sidebar-secondary:hover::-webkit-scrollbar-thumb {
  background: rgba(181, 95, 252, 0.3);
}

.section-block {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.section-title {
  font-size: 15px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent-1);
  display: flex;
  align-items: center;
  gap: 10px;
  text-shadow: 0 0 15px rgba(181, 95, 252, 0.35);
}

.section-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
}
.main-content {
  padding: 50px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.hero {
  text-align: center;
  margin-bottom: 40px;
  width: 100%;
}

.eyebrow {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(135deg, rgba(181, 95, 252, 0.15), rgba(236, 72, 153, 0.15));
  border: 1px solid rgba(181, 95, 252, 0.25);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
}

h1 {
  margin: 16px 0 8px;
  font-size: clamp(28px, 4.5vw, 52px);
  line-height: 1.1;
  font-weight: 800;
  background: linear-gradient(135deg, #ffffff 40%, #decafc 75%, #ec4899 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 25px rgba(181, 95, 252, 0.15);
}

.subtitle {
  max-width: 640px;
  margin: 0 auto 18px;
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1.6;
}

/* 📊 Живой виджет «Глава Хаоса» и умная аналитика */
.analytics-widget {
  width: 100%;
  max-width: 580px;
  margin: 0 auto 24px;
  padding: 16px 20px;
  border-radius: 16px;
  background: rgba(14, 8, 28, 0.6);
  border: 1px solid rgba(181, 95, 252, 0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 16px;
  text-align: left;
}

.analytics-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.analytics-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}

.analytics-value {
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 0 10px rgba(181, 95, 252, 0.2);
}

.search-container {
  width: 100%;
  max-width: 440px;
  margin: 0 auto 24px;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 14px 18px;
  border-radius: 12px;
  background: rgba(11, 7, 24, 0.6);
  border: 1px solid rgba(181, 95, 252, 0.25);
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: var(--transition-smooth);
  backdrop-filter: blur(10px);
}

.search-input:focus {
  border-color: var(--accent-1);
  box-shadow: var(--glow), inset 0 0 8px rgba(181, 95, 252, 0.15);
  background: rgba(11, 7, 24, 0.85);
}

.search-input::placeholder {
  color: rgba(180, 171, 191, 0.4);
}
.status {
  margin: 14px auto 0;
  width: fit-content;
  padding: 6px 16px;
  border-radius: 999px;
  color: #fff;
  background: rgba(181, 95, 252, 0.05);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
  border: 1px solid rgba(181, 95, 252, 0.2);
  display: flex;
  align-items: center;
  gap: 8px;
}

.status .dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-1);
  box-shadow: 0 0 10px var(--accent-1);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.tree {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.level-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 1000px;
  margin-bottom: 36px;
  transition: var(--transition-smooth);
}

.level-label {
  width: 100%;
  text-align: center;
  margin-bottom: 16px;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  opacity: 0.75;
}

.sub-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: start;
  gap: 24px;
  width: 100%;
  margin-bottom: 24px;
}
.sub-row:last-child {
  margin-bottom: 0;
}

.connector {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 12px 0;
}

.connector .vline {
  width: 2px;
  height: 40px;
  background: var(--line-grad);
}

.center-card {
  min-width: min(300px, 100%);
  text-align: center;
  padding: 32px 24px;
  border-radius: 22px;
  border: 1px solid var(--border-inner);
  background: rgba(22, 13, 38, 0.9);
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45), var(--glow);
  position: relative;
  flex: 1 1 300px;
  max-width: 440px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: var(--transition-smooth);
  cursor: pointer;
}

.center-card:hover {
  transform: translateY(-5px) scale(1.02);
  border-color: #c084fc;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.55), 0 0 25px rgba(181, 95, 252, 0.5);
}

.center-card::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 22px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  z-index: -1;
  opacity: 0.3;
}

.center-card .icon {
  font-size: 38px;
  line-height: 1;
  margin-bottom: 12px;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
}

.center-card .name {
  display: block;
  font-size: 26px;
  font-weight: 800;
  background: linear-gradient(135deg, #fff 0%, #e9d5ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1.2;
}

.center-card .role {
  display: block;
  color: var(--accent-1);
  margin-top: 8px;
  font-size: 14px;
  font-weight: 600;
}

.group {
  flex: 1 1 290px;
  max-width: 440px;
  border: 1px solid var(--border-outer);
  border-radius: 20px;
  background: var(--bg-panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: var(--transition-smooth);
}

.group:hover {
  transform: translateY(-4px);
  border-color: rgba(181, 95, 252, 0.25);
  box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
}

.group-head {
  padding: 18px 20px 14px;
  border-bottom: 1px solid rgba(181, 95, 252, 0.06);
  background: rgba(255, 255, 255, 0.005);
}

.group-head h2 {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
}

.group-head .sub {
  margin-top: 6px;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.4;
}

.people {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
}

.person {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(255, 255, 255, 0.005);
  border-radius: var(--card-radius);
  background: rgba(255, 255, 255, 0.005);
  transition: var(--transition-smooth);
  cursor: pointer;
}

.person:hover {
  background: rgba(181, 95, 252, 0.06);
  border-color: rgba(181, 95, 252, 0.22);
  transform: translateX(4px);
}

.avatar {
  flex: 0 0 42px;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  font-size: 22px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.person-info {
  min-width: 0;
  flex: 1;
}

.person-name {
  font-weight: 600;
  font-size: 16px;
  overflow-wrap: anywhere;
  line-height: 1.3;
  color: #fff;
}

.person-role {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 13px;
}

.person.search-fade, .group.search-fade, .center-card.search-fade {
  opacity: 0.15;
  filter: blur(1px) grayscale(0.5);
  transform: scale(0.98);
}

.person.partner-highlighted {
  background: rgba(236, 72, 153, 0.12) !important;
  border-color: rgba(236, 72, 153, 0.6) !important;
  box-shadow: var(--glow-partner) !important;
  transform: scale(1.03) translateY(-1px) !important;
  opacity: 1 !important;
  filter: none !important;
}

/* 🃏 Карточки персонажей в стиле RPG-кликеров */
.rpg-stats {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 18px 0;
  text-align: left;
}

.rpg-stat-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rpg-stat-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
}

.rpg-bar-bg {
  width: 100%;
  height: 8px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.02);
}

.rpg-bar-fill {
  height: 100%;
  border-radius: 99px;
  width: 0%;
  transition: width 0.6s cubic-bezier(0.1, 1, 0.1, 1);
}

.bar-chaos { background: linear-gradient(90deg, #b55ffc, #ec4899); }
.bar-cozy { background: linear-gradient(90deg, #34d399, #059669); }
.bar-resistance { background: linear-gradient(90deg, #fbbf24, #f59e0b); }

.rpg-random-btn {
  width: 100%;
  margin-top: 14px;
  background: rgba(181, 95, 252, 0.1);
  border: 1px solid rgba(181, 95, 252, 0.3);
  color: #fff;
  padding: 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.rpg-random-btn:hover {
  background: var(--accent-1);
  box-shadow: var(--glow);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(3, 2, 7, 0.75);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-inner);
  box-shadow: var(--glow);
  padding: 34px 28px;
  border-radius: 24px;
  max-width: 440px;
  width: 90%;
  text-align: center;
  transform: scale(0.9);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-overlay.active .modal-card {
  transform: scale(1);
}

.modal-avatar {
  font-size: 64px;
  margin-bottom: 12px;
  display: inline-block;
  animation: bounceEmoji 2s infinite alternate ease-in-out;
}

@keyframes bounceEmoji {
  to { transform: translateY(-8px); }
}

.modal-name {
  font-size: 26px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 4px;
}

.modal-role {
  font-size: 15px;
  color: var(--accent-1);
  font-weight: 600;
  margin-bottom: 16px;
}

.modal-badge {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border-outer);
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 14px;
  color: var(--text-main);
  line-height: 1.5;
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close {
  margin-top: 16px;
  background: #05030d;
  border: 1px solid var(--border-inner);
  color: #fff;
  padding: 12px 28px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: var(--transition-smooth);
}

.modal-close:hover {
  background: var(--accent-1);
  box-shadow: var(--glow);
}

@media (max-width: 1200px) {
  .layout-grid { grid-template-columns: 1fr; }
  .sidebar, .sidebar-secondary { height: auto; position: relative; border: none; border-bottom: 1px solid rgba(16, 185, 129, 0.04); padding: 30px 16px; }
  .main-content { padding: 40px 20px; }
  .sub-row { flex-direction: column; align-items: center; }
}
</style>
</head>
<body>

<button class="perf-toggle" id="perf-toggle">⚡ Слабый ПК / Телефон</button>

<div class="bg-canvas">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<main class="layout-grid">
  <!-- ЛЕВАЯ КОЛОНКА: Особые люди и Питомцы -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА: Шапка, Умная Аналитика и Древо -->
  <div class="main-content">
    <header class="hero">
      <div class="eyebrow" id="eyebrow">Инициализация...</div>
      <h1 id="title">Семейное древо</h1>
      <p class="subtitle" id="subtitle"></p>
      
      <!-- 📊 СВЕЖИЙ ЖИВОЙ ВИДЖЕТ УМНОЙ АНАЛИТИКИ ХАОСА -->
      <div class="analytics-widget" id="analytics-widget">
        <div class="analytics-item">
          <span class="analytics-label">Всего родных</span>
          <span class="analytics-value" id="stat-people">0</span>
        </div>
        <div class="analytics-item">
          <span class="analytics-label">Хвостиков</span>
          <span class="analytics-value" id="stat-pets">0</span>
        </div>
        <div class="analytics-item">
          <span class="analytics-label">Стабильность</span>
          <span class="analytics-value" id="stat-stable">100%</span>
        </div>
        <div class="analytics-item">
          <span class="analytics-label">Правящий Клан</span>
          <span class="analytics-value" id="stat-clan">Анализ...</span>
        </div>
      </div>

      <!-- Интерактивная строка поиска -->
      <div class="search-container">
        <input type="text" id="tree-search" class="search-input" placeholder="Поиск по имени или роли...">
      </div>

      <div class="status" id="status"><span class="dot"></span>Анализ семейной базы данных...</div>
    </header>

    <!-- Сюда выводится дерево по подрядам -->
    <section id="content"></section>
    
    <footer class="final-quote" id="footer"></footer>
  </div>
  
  <!-- ПРАВАЯ КОЛОНКА: Окружение и Подруги -->
  <aside class="sidebar-secondary" id="sidebar-secondary"></aside>
</main>

<!-- 🃏 ОБНОВЛЕННОЕ RPG МОДАЛЬНОЕ ОКНО С РАНДОМИЗАТОРОМ СТАТУСОВ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card">
    <div class="modal-avatar" id="modal-avatar">👤</div>
    <div class="modal-name" id="modal-name">Имя</div>
    <div class="modal-role" id="modal-role">Роль</div>
    
    <!-- RPG Полосы Прокачки Характеристик -->
    <div class="rpg-stats">
      <div class="rpg-stat-row">
        <div class="rpg-stat-header"><span>Урон хаосом</span><span id="rpg-val-chaos">0%</span></div>
        <div class="rpg-bar-bg"><div class="rpg-bar-fill bar-chaos" id="rpg-bar-chaos"></div></div>
      </div>
      <div class="rpg-stat-row">
        <div class="rpg-stat-header"><span>Генерация уюта</span><span id="rpg-val-cozy">0%</span></div>
        <div class="rpg-bar-bg"><div class="rpg-bar-fill bar-cozy" id="rpg-bar-cozy"></div></div>
      </div>
      <div class="rpg-stat-row">
        <div class="rpg-stat-header"><span>Иммунитет к душноте</span><span id="rpg-val-resistance">0%</span></div>
        <div class="rpg-bar-bg"><div class="rpg-bar-fill bar-resistance" id="rpg-bar-resistance"></div></div>
      </div>
    </div>

    <!-- Интерактивный Рандомизатор Секретных Фактов -->
    <div class="modal-badge" id="modal-badge">Загрузка протокола хаоса...</div>
    <button class="rpg-random-btn" id="rpg-random-btn">🎲 Сгенерировать случайный факт</button>
    <br>
    <button class="modal-close" id="modal-close">Закрыть профиль</button>
  </div>
</div>
<script>
var JSON_FILE = "family.json";
var REFRESH_MS = 30000;
var lastJSON = "";

// База данных угарных секретных статусов для рандомизатора
var RANDOM_FACTS = [
  "Замечен в скрытном поедании ночных вкусняшек на кухне.",
  "Главный генератор хаотичных идей в общем семейном чате.",
  "Обладает абсолютным врождённым иммунитетом к любой домашней душноте.",
  "Регулярно крадет чужие носки, списывая это на аномалии хаоса.",
  "Способен уснуть в любой точке квартиры за 4.2 секунды.",
  "Секретное оружие уюта. Одним присутствием снимает бытовой стресс.",
  "Официально признан самым громким смехом этой вселенной.",
  "Подозревается в тайном заговоре с домашними питомцами ради внеочередной еды.",
  "Мастер создавать панику из-за потерянного телефона, который в этот момент находится в руке.",
  "Гроссмейстер диванных дискуссий и ночных кухонных переговоров."
];

// Функция безопасного экранирования спецсимволов (Защита от XSS-уязвимостей)
function esc(v) {
  if (!v) return "";
  return String(v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function levelLabelText(level) {
  var labels = {0: "Старшее поколение", 1: "Родители", 2: "Дети своих родителей", 4: "Племянники и племянницы", 3: "Мои Дети"};
  return labels[level] || ("Уровень " + level);
}

function renderGroup(group) {
  var h = "";
  h += '<article class="group" data-search-block="true">';
  h += '<div class="group-head">';
  h += '<h2>' + esc(group.title) + '</h2>';
  if (group.subtitle && group.subtitle.trim() !== "") {
    h += '<div class="sub">' + esc(group.subtitle) + '</div>';
  }
  h += '</div>';
  h += '<div class="people">';
  
  var ppl = group.people || [];
  for (var i = 0; i < ppl.length; i++) {
    var p = ppl[i];
    h += '<div class="person" data-name="' + esc(p.name) + '" data-role="' + esc(p.role) + '" data-icon="' + esc(p.icon || "💜") + '">';
    h += '<div class="avatar">' + esc(p.icon || "💜") + '</div>';
    h += '<div class="person-info">';
    h += '<div class="person-name">' + esc(p.name) + '</div>';
    h += '<div class="person-role">' + esc(p.role || "") + '</div>';
    h += '</div>';
    h += '</div>';
  }
  
  h += '</div>';
  h += '</article>';
  return h;
}

function renderCenter(center) {
  var h = '<div class="center-card" data-search-block="true" data-name="' + esc(center.name) + '" data-role="' + esc(center.role) + '" data-icon="' + esc(center.icon || "💜") + '">';
  h += '<div class="icon">' + esc(center.icon || "💜") + '</div>';
  h += '<span class="name">' + esc(center.name || "Я") + '</span>';
  h += '<span class="role">' + esc(center.role || "") + '</span>';
  h += '</div>';
  return h;
}

function populateSidebar(elementId, dataArray) {
  var h = "";
  for (var i = 0; i < dataArray.length; i++) {
    h += renderGroup(dataArray[i]);
  }
  document.getElementById(elementId).innerHTML = h;
}

function getPartnerName(name) {
  var pairs = {
    "Diamonita Grand": "EKSOD_GRAND",
    "EKSOD_GRAND": "Diamonita Grand",
    "卄乇ㄥㄥ匚卂ㄒ": "sataney",
    "sataney": "卄乇ㄥㄥ匚卂ㄒ",
    "§LAGDAN§": "vera ba7a",
    "vera ba7a": "§LAGDAN§"
  };
  return pairs[name] || null;
}

function generateChaosStatus(name, role) {
  if (name === "Diamonita Grand" || name === "EKSOD_GRAND" || name === "sataney" || name === "卄乇ㄥㄥ匚卂ㄒ") {
    return "Особый статус: Взаимное притяжение сердец. Нарушение законов хаоса ради абсолютного уюта. 💜";
  }
  if (name === "vera ba7a" || name === "§LAGDAN§") {
    return "Кровные узы: Родные брат и сестра. Фундамент и вековая мудрость старшего поколения хроник хаоса.";
  }
  if (role.toLowerCase().indexOf("священник") !== -1) {
    return "Влияние на экосистему: Регулярно отпускает грехи семейного хаоса. Духовный щит дома укреплен.";
  }
  if (role.toLowerCase().indexOf("психотерапевт") !== -1) {
    return "Влияние на экосистему: Восстанавливает ментальное здоровье семьи после затяжных бытовых штормов.";
  }
  if (role.toLowerCase().indexOf("участковый") !== -1) {
    return "Влияние на экосистему: Контролирует соблюдение границ комендантского часа и уровень шума в хрониках.";
  }
  if (role.toLowerCase().indexOf("кот") !== -1 || role.toLowerCase().indexOf("песель") !== -1 || role.toLowerCase().indexOf("собака") !== -1) {
    return "Статус в хаосе: Пушистый хранитель тепла. Назначение — генерация мурчания и требование внеочередной еды. 🐾";
  }
  return "Официальный протокол: Активный участник семейной вселенной. Создает неповторимый баланс уюта и драйва.";
}

// Умный расчёт RPG-характеристик на основе букв в нике (Алгоритм псевдорандома)
function getRPGStats(name) {
  var code = 0;
  for (var i = 0; i < name.length; i++) {
    code += name.charCodeAt(i);
  }
  var chaos = (code % 45) + 55;      // От 55% до 100%
  var cozy = ((code * 3) % 40) + 60;  // От 60% до 100%
  var resist = ((code * 7) % 50) + 50;// От 50% до 100%
  return { chaos: chaos, cozy: cozy, resist: resist };
}
function render(data) {
  document.title = data.title || "Семейное древо";
  document.getElementById("eyebrow").textContent = data.eyebrow || "";
  document.getElementById("title").textContent = data.title || "Семейное древо";
  document.getElementById("subtitle").textContent = data.subtitle || "";
  document.getElementById("footer").innerHTML = (data.footer || "").replace(/💜/g, '<span class="emerald-heart">💜</span>');

  var center = data.center || {};
  var centerLevel = (center.level !== undefined) ? center.level : 2;
  var groups = Array.isArray(data.groups) ? data.groups : [];
  
  var closePeople = Array.isArray(data.closePeople) ? data.closePeople : [];
  var secondaryPeople = Array.isArray(data.secondaryPeople) ? data.secondaryPeople : [];

  populateSidebar("sidebar", closePeople);
  populateSidebar("sidebar-secondary", secondaryPeople);

  var levels = {};
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    var lv = (g.level !== undefined) ? g.level : 0;
    if (!levels[lv]) levels[lv] = [];
    levels[lv].push(g);
  }
  if (!levels[centerLevel]) levels[centerLevel] = [];
  levels[centerLevel]._hasCenter = true;

  var sortedLevels = Object.keys(levels).sort(function(a,b){return Number(a)-Number(b)});

  var html = '<div class="tree">';
  for (var idx = 0; idx < sortedLevels.length; idx++) {
    var lv = sortedLevels[idx];
    var levelNum = Number(lv);
    if (idx > 0) {
      html += '<div class="connector"><div class="vline"></div></div>';
    }
    
    html += '<div class="level-row">';
    html += '<div class="level-label">' + esc(levelLabelText(levelNum)) + '</div>';

    var lvGroups = levels[lv] || [];
    
    // Двухрядная архитектура распределения родственников внутри уровней
    if (levelNum === 2) {
      html += '<div class="sub-row">';
      if (levels[lv]._hasCenter) {
        html += renderCenter(center);
      }
      var wifeGroup = lvGroups.find(function(g) { return g.title.indexOf("Жена") !== -1; });
      if (wifeGroup) html += renderGroup(wifeGroup);
      html += '</div>';

      html += '<div class="sub-row">';
      var otherGroups2 = lvGroups.filter(function(g) { return g.title.indexOf("Жена") === -1; });
      for (var j = 0; j < otherGroups2.length; j++) {
        html += renderGroup(otherGroups2[j]);
      }
      html += '</div>';

    } else if (levelNum === 3) {
      html += '<div class="sub-row">';
      var bloodChildren = lvGroups.filter(function(g) { 
        return g.title.indexOf("Зятья") === -1 && g.title.indexOf("Снохи") === -1; 
      });
      for (var j = 0; j < bloodChildren.length; j++) {
        html += renderGroup(bloodChildren[j]);
      }
      html += '</div>';

      html += '<div class="sub-row">';
      var inLaws = lvGroups.filter(function(g) { return g.title.indexOf("Зятья") !== -1; });
      for (var j = 0; j < inLaws.length; j++) {
        html += renderGroup(inLaws[j]);
      }
      var daughterInLaw = lvGroups.filter(function(g) { return g.title.indexOf("Снохи") !== -1; });
      for (var j = 0; j < daughterInLaw.length; j++) {
        html += renderGroup(daughterInLaw[j]);
      }
      html += '</div>';

    } else {
      html += '<div class="sub-row">';
      for (var j = 0; j < lvGroups.length; j++) {
        html += renderGroup(lvGroups[j]);
      }
      html += '</div>';
    }

    html += '</div>';
  }
  html += '</div>';

  document.getElementById("content").innerHTML = html;

  // Динамический расчёт параметров для живого виджета аналитики хаоса в шапке
  var totalPeople = 0;
  var totalPets = 0;
  var largestClanName = "Нет";
  var maxClanSize = 0;

  if (data.center) totalPeople++;
  
  groups.forEach(function(g) {
    var size = Array.isArray(g.people) ? g.people.length : 0;
    totalPeople += size;
    var cleanTitle = g.title.replace(/[^\w\sа-яА-ЯёЁ]/g, '').trim();
    if (size > maxClanSize && cleanTitle !== "Зятья" && cleanTitle !== "Любимые Снохи") {
      maxClanSize = size;
      largestClanName = cleanTitle;
    }
  });

  closePeople.forEach(function(s) {
    var size = Array.isArray(s.people) ? s.people.length : 0;
    if (s.title.indexOf("питомцы") !== -1 || s.title.indexOf("🐾") !== -1) {
      totalPets += size;
    } else {
      totalPeople += size;
    }
  });

  secondaryPeople.forEach(function(s) {
    totalPeople += Array.isArray(s.people) ? s.people.length : 0;
  });

  var childrenCount = 0;
  var kidsGroups = groups.filter(function(g){ return g.level === 3 && g.title.indexOf("Снохи") === -1 && g.title.indexOf("Зятья") === -1; });
  kidsGroups.forEach(function(k){ childrenCount += k.people.length; });
  var stability = Math.max(12, 100 - (childrenCount * 8));

  document.getElementById("stat-people").textContent = totalPeople;
  document.getElementById("stat-pets").textContent = totalPets;
  document.getElementById("stat-stable").textContent = stability + "%";
  document.getElementById("stat-clan").textContent = largestClanName;

  applySearchFilter();
}
function loadFamily() {
  var status = document.getElementById("status");
  fetch(JSON_FILE + "?v=" + Date.now(), {cache: "no-store"})
    .then(function(resp) {
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.text();
    })
    .then(function(text) {
      var data;
      try { data = JSON.parse(text); } catch (e) { throw new Error("Ошибка JSON: " + e.message); }
      if (text !== lastJSON) {
        render(data);
        lastJSON = text;
      }
      status.innerHTML = '<span class="dot"></span>Экосистема активна | База обновлена | ' + new Date().toLocaleTimeString("ru-RU");
    })
    .catch(function(err) {
      status.innerHTML = '<span class="dot" style="background:#f87171; box-shadow: 0 0 10px #f87171;"></span>Сбой: ' + err.message;
      console.error(err);
    });
}

function applySearchFilter() {
  var query = document.getElementById("tree-search").value.toLowerCase().trim();
  var groupArticles = document.querySelectorAll('.group');
  var centerCard = document.querySelector('.center-card');

  if (!query) {
    var items = document.querySelectorAll('.search-fade');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('search-fade');
    return;
  }

  if (centerCard) {
    var cName = (centerCard.getAttribute('data-name') || '').toLowerCase();
    var cRole = (centerCard.getAttribute('data-role') || '').toLowerCase();
    if (cName.indexOf(query) !== -1 || cRole.indexOf(query) !== -1) {
      centerCard.classList.remove('search-fade');
    } else {
      centerCard.classList.add('search-fade');
    }
  }

  for (var i = 0; i < groupArticles.length; i++) {
    var group = groupArticles[i];
    var innerPeople = group.querySelectorAll('.person');
    var groupHasMatch = false;

    for (var j = 0; j < innerPeople.length; j++) {
      var person = innerPeople[j];
      var pName = (person.getAttribute('data-name') || '').toLowerCase();
      var pRole = (person.getAttribute('data-role') || '').toLowerCase();

      if (pName.indexOf(query) !== -1 || pRole.indexOf(query) !== -1) {
        person.classList.remove('search-fade');
        groupHasMatch = true;
      } else {
        person.classList.add('search-fade');
      }
    }

    if (groupHasMatch) {
      group.classList.remove('search-fade');
    } else {
      group.classList.add('search-fade');
    }
  }
}

var perfToggle = document.getElementById('perf-toggle');
if (localStorage.getItem('perfMode') === 'true') {
  document.body.classList.add('perf-mode');
  perfToggle.textContent = "🚀 Обычный режим";
}
perfToggle.addEventListener('click', function() {
  var isPerf = document.body.classList.toggle('perf-mode');
  localStorage.setItem('perfMode', isPerf);
  perfToggle.textContent = isPerf ? "🚀 Обычный режим" : "⚡ Слабый ПК / Телефон";
});

// ЛОГИКА ИНТЕРАКТИВНЫХ RPG КАРТОЧЕК И РАНДОМИЗАТОРА ФАКТОВ
var modalOverlay = document.getElementById('modal-overlay');
var modalAvatar = document.getElementById('modal-avatar');
var modalName = document.getElementById('modal-name');
var modalRole = document.getElementById('modal-role');
var modalBadge = document.getElementById('modal-badge');
var randomBtn = document.getElementById('rpg-random-btn');

var activeModalName = "";

document.addEventListener('click', function(e) {
  var targetCard = e.target.closest('.person') || e.target.closest('.center-card');
  if (!targetCard) return;

  var name = targetCard.getAttribute('data-name');
  var role = targetCard.getAttribute('data-role') || 'Участник хаоса';
  var icon = targetCard.getAttribute('data-icon') || '👤';

  activeModalName = name;
  modalAvatar.textContent = icon;
  modalName.textContent = name;
  modalRole.textContent = role;
  modalBadge.textContent = generateChaosStatus(name, role);

  // Расчёт и плавная анимация RPG характеристик
  var rpg = getRPGStats(name);
  
  document.getElementById('rpg-bar-chaos').style.width = '0%';
  document.getElementById('rpg-bar-cozy').style.width = '0%';
  document.getElementById('rpg-bar-resistance').style.width = '0%';

  document.getElementById('rpg-val-chaos').textContent = rpg.chaos + "%";
  document.getElementById('rpg-val-cozy').textContent = rpg.cozy + "%";
  document.getElementById('rpg-val-resistance').textContent = rpg.resist + "%";

  setTimeout(function() {
    document.getElementById('rpg-bar-chaos').style.width = rpg.chaos + "%";
    document.getElementById('rpg-bar-cozy').style.width = rpg.cozy + "%";
    document.getElementById('rpg-bar-resistance').style.width = rpg.resist + "%";
  }, 100);

  modalOverlay.classList.add('active');
});

// Кнопка случайного факта
randomBtn.addEventListener('click', function() {
  var randomIndex = Math.floor(Math.random() * RANDOM_FACTS.length);
  modalBadge.style.opacity = 0;
  setTimeout(function() {
    modalBadge.textContent = RANDOM_FACTS[randomIndex];
    modalBadge.style.opacity = 1;
  }, 200);
});

document.getElementById('modal-close').addEventListener('click', function() {
  modalOverlay.classList.remove('active');
});

modalOverlay.addEventListener('click', function(e) {
  if (e.target === modalOverlay) modalOverlay.classList.remove('active');
});

document.getElementById('tree-search').addEventListener('input', applySearchFilter);

loadFamily();
setInterval(loadFamily, REFRESH_MS);

document.addEventListener('mouseover', function(e) {
  if(document.body.classList.contains('perf-mode')) return;
  var personCard = e.target.closest('.person');
  if (!personCard) return;

  var name = personCard.getAttribute('data-name');
  var partnerName = getPartnerName(name);

  if (partnerName) {
    var partnerCard = document.querySelector('.person[data-name="' + partnerName + '"]');
    personCard.classList.add('partner-highlighted');
    if (partnerCard) {
      partnerCard.classList.add('partner-highlighted');
    }
  }
});

document.addEventListener('mouseout', function(e) {
  var personCard = e.target.closest('.person');
  if (!personCard) return;

  var name = personCard.getAttribute('data-name');
  var partnerName = getPartnerName(name);

  if (partnerName) {
    var partnerCard = document.querySelector('.person[data-name="' + partnerName + '"]');
    if (partnerCard) {
      partnerCard.classList.remove('partner-highlighted');
    }
  }
  personCard.classList.remove('partner-highlighted');
});
</script>
</body>
</html>
