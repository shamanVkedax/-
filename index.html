<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейное древо 💜</title>
<style>
:root{
  --bg1:#0d0a1a; --bg2:#1a1230;
  --card:rgba(28,21,49,.82);
  --text:#f5f0ff; --muted:#a895c4; --muted2:#8a7ba8;
  --accent:#b07cff; --accent2:#ff79c6; --accent3:#5eead4;
  --border:rgba(188,124,255,.18); --border-bright:rgba(188,124,255,.4);
  --green:#6ee7b7; --pink:#f9a8d4; --blue:#93c5fd; --gold:#fcd34d;
  --shadow:0 12px 40px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;color:var(--text);
  font-family:'Segoe UI','Inter',system-ui,sans-serif;
  background:
    radial-gradient(ellipse at 15% 8%,rgba(176,124,255,.15),transparent 35%),
    radial-gradient(ellipse at 85% 25%,rgba(255,121,198,.1),transparent 30%),
    radial-gradient(ellipse at 50% 90%,rgba(94,234,212,.06),transparent 40%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
}
.page{max-width:1400px;margin:0 auto;padding:40px 20px 60px}

/* Шапка */
.hero{text-align:center;margin-bottom:36px}
.eyebrow{
  display:inline-block;padding:7px 16px;
  border:1px solid rgba(220,185,255,.22);border-radius:999px;
  color:#dac4ee;background:rgba(255,255,255,.04);
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
}
h1{
  margin:16px 0 8px;font-size:clamp(32px,6vw,64px);line-height:1.05;
  letter-spacing:-.04em;font-weight:800;
  background:linear-gradient(100deg,#fff,#d8b8ff,#ffacd9);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.subtitle{max-width:680px;margin:0 auto;color:var(--muted);font-size:16px;line-height:1.6}
.status{
  margin:14px auto 0;width:fit-content;padding:6px 14px;border-radius:999px;
  color:#a298b4;background:rgba(255,255,255,.04);font-size:11px;
  border:1px solid rgba(255,255,255,.05);
}
.status .dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--green);margin-right:6px;animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Центральная карточка */
.center-wrap{display:flex;justify-content:center;margin-bottom:40px}
.center{
  min-width:min(420px,100%);text-align:center;
  padding:28px 36px;border-radius:24px;
  border:1px solid var(--border-bright);
  background:linear-gradient(135deg,rgba(176,124,255,.18),rgba(255,121,198,.08)),rgba(20,15,37,.95);
  box-shadow:0 16px 50px rgba(176,124,255,.15);
  position:relative;
}
.center::before{
  content:'';position:absolute;inset:-2px;border-radius:24px;
  background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));
  z-index:-1;opacity:.3;filter:blur(12px);
}
.center .icon{font-size:36px;line-height:1}
.center .name{display:block;font-size:28px;font-weight:800;margin-top:8px;
  background:linear-gradient(100deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.center .role{display:block;color:#cfbce7;margin-top:6px;font-size:14px;font-style:italic}

/* Дерево — уровни */
.tree{display:flex;flex-direction:column;align-items:center;gap:0}
.level{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;width:100%;position:relative}
.level + .level{margin-top:44px}
.level + .level::before{
  content:'';position:absolute;top:-44px;left:50%;
  width:2px;height:44px;
  background:linear-gradient(to bottom,transparent,var(--border-bright));
}

/* Группы-карточки */
.group{
  flex:1 1 320px;max-width:380px;
  border:1px solid var(--border);border-radius:20px;
  background:var(--card);backdrop-filter:blur(14px);
  overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s;
}
.group:hover{
  border-color:var(--border-bright);
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}
.group-head{padding:16px 18px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.group-head h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.group-head .sub{margin-top:4px;color:var(--muted2);font-size:12px;line-height:1.4}
.group-tag{
  display:inline-block;padding:2px 8px;border-radius:6px;
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  margin-left:auto;white-space:nowrap;
}
.tag-0{background:rgba(110,231,183,.12);color:var(--green);border:1px solid rgba(110,231,183,.2)}
.tag-1{background:rgba(147,197,253,.12);color:var(--blue);border:1px solid rgba(147,197,253,.2)}
.tag-2{background:rgba(249,168,212,.12);color:var(--pink);border:1px solid rgba(249,168,212,.2)}
.tag-special{background:rgba(252,211,77,.12);color:var(--gold);border:1px solid rgba(252,211,77,.2)}

.people{display:flex;flex-direction:column;gap:8px;padding:12px}
.person{
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  border:1px solid rgba(255,255,255,.04);border-radius:14px;
  background:rgba(255,255,255,.025);transition:all .18s;
}
.person:hover{
  background:rgba(176,124,255,.06);
  border-color:rgba(176,124,255,.15);
}
.avatar{
  flex:0 0 38px;width:38px;height:38px;display:grid;place-items:center;
  border-radius:12px;font-size:18px;
  background:linear-gradient(135deg,rgba(176,124,255,.2),rgba(255,121,198,.1));
  border:1px solid rgba(255,255,255,.05);
}
.person-info{min-width:0;flex:1}
.person-name{font-weight:700;font-size:14px;overflow-wrap:anywhere;line-height:1.3}
.person-role{margin-top:2px;color:var(--muted2);font-size:11px;line-height:1.3}

/* Соединительные линии между уровнями */
.connectors{
  display:flex;justify-content:center;gap:20px;width:100%;
  height:40px;position:relative;
}
.connector-line{
  flex:1 1 320px;max-width:380px;display:flex;justify-content:center;
}
.connector-line svg{width:100%;height:40px}

/* Подвал */
.footer{
  text-align:center;margin-top:50px;padding:24px;
  color:#8a7ba8;font-size:13px;line-height:1.7;
  border-top:1px solid rgba(255,255,255,.05);
}
.footer .heart{color:var(--accent2)}

/* Ошибка */
.error-box{
  max-width:600px;margin:30px auto;padding:20px;
  border:1px solid #75405b;border-radius:16px;background:#281421;
  color:#f0a0b8;text-align:center;font-size:14px;line-height:1.6;
}

/* Анимация появления */
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.group{animation:fadeIn .4s ease-out}
.group:nth-child(1){animation-delay:.05s}
.group:nth-child(2){animation-delay:.1s}
.group:nth-child(3){animation-delay:.15s}
.group:nth-child(4){animation-delay:.2s}
.group:nth-child(5){animation-delay:.25s}
.group:nth-child(6){animation-delay:.3s}

/* Адаптив */
@media(max-width:1000px){.group{flex:1 1 280px;max-width:340px}}
@media(max-width:680px){
  .page{padding:28px 12px 40px}
  .group{flex:1 1 100%;max-width:none}
  .center{padding:22px 20px}
  .center .name{font-size:24px}
}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="eyebrow" id="eyebrow">Загрузка...</div>
    <h1 id="title">Семейное древо</h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="status" id="status"><span class="dot"></span>Загружаю family.json...</div>
  </header>
  <section id="content"></section>
  <footer class="footer" id="footer"></footer>
</main>

<script>
const JSON_FILE = './family.json';
const REFRESH_MS = 30000;
let lastJSON = '';

function esc(v=''){
  return String(v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

function levelTag(level, title){
  if(title.includes('Священник')||title.includes('Подруг')||title.includes('Особые')) return 'special';
  if(level===0) return '0';
  if(level===1) return '1';
  return '2';
}

function levelLabel(level, title){
  if(title.includes('Священник')) return 'Духовная опора';
  if(title.includes('Подруг')) return 'Близкие по духу';
  if(title.includes('Особые')) return 'Особые люди';
  if(level===0) return 'Старшее поколение';
  if(level===1) return 'Родная ветвь';
  return 'Младшее поколение';
}

function render(data){
  document.title = data.title || 'Семейное древо';
  document.getElementById('eyebrow').textContent = data.eyebrow || '';
  document.getElementById('title').textContent = data.title || 'Семейное древо';
  document.getElementById('subtitle').textContent = data.subtitle || '';
  document.getElementById('footer').innerHTML = (data.footer || '').replace(/💜/g,'<span class="heart">💜</span>');

  const center = data.center || {};
  const groups = Array.isArray(data.groups) ? data.groups : [];

  // Группируем по уровням (level)
  const levels = {};
  groups.forEach(g => {
    const lv = g.level || 0;
    if(!levels[lv]) levels[lv] = [];
    levels[lv].push(g);
  });
  const sortedLevels = Object.keys(levels).sort((a,b)=>Number(a)-Number(b));

  let html = `
    <div class="center-wrap">
      <div class="center">
        <div class="icon">${esc(center.icon || '💜')}</div>
        <span class="name">${esc(center.name || 'Я')}</span>
        <span class="role">${esc(center.role || '')}</span>
      </div>
    </div>
    <div class="tree">
  `;

  sortedLevels.forEach((lv, idx) => {
    // Пунктирная линия-разделитель между уровнями
    if(idx > 0){
      html += '<div class="connectors"><div class="connector-line"><svg viewBox="0 0 100 40" preserveAspectRatio="none"><line x1="50" y1="0" x2="50" y2="40" stroke="rgba(188,124,255,.25)" stroke-width="1.5" stroke-dasharray="4,4"/></svg></div></div>';
    }

    html += '<div class="level">';
    levels[lv].forEach(group => {
      const tag = levelTag(Number(lv), group.title);
      const tagText = levelLabel(Number(lv), group.title);
      html += `
        <article class="group">
          <div class="group-head">
            <h2>${esc(group.title)} <span class="group-tag tag-${tag}">${esc(tagText)}</span></h2>
            <div class="sub">${esc(group.subtitle || '')}</div>
          </div>
          <div class="people">
            ${(group.people || []).map(person => `
              <div class="person">
                <div class="avatar">${esc(person.icon || '💜')}</div>
                <div class="person-info">
                  <div class="person-name">${esc(person.name)}</div>
                  <div class="person-role">${esc(person.role || '')}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </article>
      `;
    });
    html += '</div>';
  });

  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

async function loadFamily(){
  const status = document.getElementById('status');
  try{
    const response = await fetch(`${JSON_FILE}?v=${Date.now()}`, {cache:'no-store'});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const text = await response.text();
    if(text !== lastJSON){
      const data = JSON.parse(text);
      render(data);
      lastJSON = text;
      status.innerHTML = `<span class="dot"></span>Обновлено: ${new Date().toLocaleTimeString('ru-RU')}`;
    } else {
      status.innerHTML = `<span class="dot"></span>Проверено: ${new Date().toLocaleTimeString('ru-RU')}`;
    }
  } catch(err){
    status.innerHTML = '<span class="dot" style="background:#f87171"></span>Не удалось загрузить family.json';
    if(!lastJSON){
      document.getElementById('content').innerHTML = '<div class="error-box">⚠️ Ошибка загрузки <b>family.json</b>.<br>Проверь, что файл лежит рядом с <b>index.html</b> и содержит корректный JSON.</div>';
    }
    console.error(err);
  }
}

loadFamily();
setInterval(loadFamily, REFRESH_MS);
</script>
</body>
</html>
