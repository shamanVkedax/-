<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейное древо</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>">
<style>
:root {
  --bg-dark: #090514;
  --bg-panel: rgba(18, 12, 34, 0.45);
  --accent-1: #7c3aed;
  --accent-2: #ec4899;
  --accent-3: #10b981;
  --text-main: #ffffff;
  --text-muted: #a18cb4;
  --border-inner: rgba(124, 58, 237, 0.4);
  --border-outer: rgba(255, 255, 255, 0.05);
  --glow: 0 0 20px rgba(124, 58, 237, 0.4);
  --glow-couple: 0 0 25px rgba(236, 72, 153, 0.8);
  --line-grad: linear-gradient(to bottom, transparent, rgba(124, 58, 237, 0.15), transparent);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  margin: 0;
  color: var(--text-main);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: radial-gradient(circle at var(--bg-x1, 15%) var(--bg-y1, 20%), rgba(124, 58, 237, 0.15) 0%, transparent 40%),
              radial-gradient(circle at var(--bg-x2, 85%) var(--bg-y2, 15%), rgba(236, 72, 153, 0.12) 0%, transparent 35%),
              linear-gradient(160deg, var(--bg-dark), #0e0822);
  background-attachment: fixed;
  overflow-x: hidden;
  perspective: 1000px;
}

body.eco-mode {
  background: #090514 !important;
}

#tree-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.perf-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 9999;
  background: rgba(22, 18, 36, 0.8);
  border: 1px solid var(--border-inner);
  padding: 10px 16px;
  border-radius: 999px;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  backdrop-filter: blur(10px);
  box-shadow: var(--glow);
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.perf-toggle:hover {
  transform: translateY(-2px);
  border-color: var(--accent-2);
  box-shadow: var(--glow-couple);
}
.perf-toggle.active {
  border-color: var(--accent-3);
  box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
}

.layout-grid {
  display: grid;
  grid-template-columns: 320px 320px 1fr;
  min-height: 100vh;
  max-width: 1920px;
  margin: 0 auto;
  position: relative;
}

.search-container {
  padding: 0 4px;
  margin-bottom: -8px;
}
.search-input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(10px);
}
.search-input:focus {
  outline: none;
  border-color: var(--accent-1);
  background: rgba(124, 58, 237, 0.08);
  box-shadow: var(--glow);
}
.sidebar, .sidebar-secondary {
  padding: 40px 20px;
  overflow-y: auto;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 32px;
  z-index: 2;
}

.sidebar {
  background: rgba(5, 3, 10, 0.45);
  border-right: 1px solid rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(20px);
}

.sidebar-secondary {
  background: rgba(5, 3, 10, 0.25);
  border-right: 1px solid rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(15px);
}

.section-title {
  font-size: 17px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent-2);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-shadow: 0 0 12px rgba(236, 72, 153, 0.4);
}

.section-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 16px;
  line-height: 1.4;
}

.card-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sidebar-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-outer);
  border-radius: 14px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(20px);
  transform-style: preserve-3d;
}

.sidebar-card:hover {
  border-color: rgba(124, 58, 237, 0.6);
  box-shadow: var(--glow);
  background: rgba(22, 14, 42, 0.7);
}

.avatar-small {
  flex: 0 0 38px;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 20px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.info-small h4 {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.02em;
}
.info-small p {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 1px;
}

.is-hidden {
  display: none !important;
}

.tree-dimmed .person,
.tree-dimmed .sidebar-card,
.tree-dimmed .center-card {
  opacity: 0.24;
  filter: blur(1px);
}

.tree-dimmed .person.couple-highlight,
.tree-dimmed .sidebar-card.couple-highlight,
.tree-dimmed .center-card.couple-highlight {
  opacity: 1 !important;
  filter: none !important;
}

.group-head {
  padding: 16px 20px 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  cursor: pointer;
  user-select: none;
}

.section-block {
  cursor: pointer;
}

.collapsed .people,
.collapsed .card-list,
.collapsed .section-desc {
  display: none !important;
}

.main-content {
  padding: 40px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 2;
}

.hero {
  text-align: center;
  margin-bottom: 48px;
  width: 100%;
}

.eyebrow {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
  backdrop-filter: blur(5px);
}

h1 {
  margin: 14px 0 8px;
  font-size: clamp(28px, 5vw, 56px);
  line-height: 1.05;
  font-weight: 800;
  background: linear-gradient(100deg, #fff, #c4b5e0, #ffdbeb);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
}

.subtitle {
  max-width: 640px;
  margin: 0 auto 16px;
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.6;
}

.status {
  margin: 12px auto 0;
  width: fit-content;
  padding: 8px 16px;
  border-radius: 999px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.02);
  font-size: 12px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  cursor: pointer;
  transition: all 0.2s ease;
  backdrop-filter: blur(10px);
}

.status:hover {
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  border-color: rgba(255,255,255,0.1);
}

.status .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-3);
  margin-right: 8px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.tree {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.level-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 32px;
  width: 100%;
  position: relative;
  margin-bottom: 40px;
}

.level-label {
  width: 100%;
  text-align: center;
  margin-bottom: 12px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  opacity: 0.7;
}

.connector {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 12px 0;
  position: relative;
  opacity: 0.2;
}
.connector .vline {
  width: 2px;
  height: 40px;
  background: var(--line-grad);
}

.center-card {
  min-width: min(320px, 100%);
  text-align: center;
  padding: 32px;
  border-radius: 24px;
  border: 1px solid var(--border-inner);
  background: rgba(26, 16, 48, 0.5);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), var(--glow);
  position: relative;
  flex: 1 1 320px;
  max-width: 400px;
  backdrop-filter: blur(25px);
  transform-style: preserve-3d;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.center-card .icon {
  font-size: 38px;
  line-height: 1;
  margin-bottom: 10px;
  filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4));
}

.center-card .name {
  display: block;
  font-size: 26px;
  font-weight: 800;
  margin-top: 4px;
  background: linear-gradient(100deg, #a78bfa, #f472b6);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1.1;
  text-shadow: 0 0 16px rgba(167, 139, 250, 0.4);
}

.center-card .role {
  display: block;
  color: var(--text-muted);
  margin-top: 8px;
  font-size: 15px;
  font-style: italic;
  line-height: 1.4;
}

.group {
  flex: 1 1 320px;
  max-width: 620px; 
  border: 1px solid var(--border-outer);
  border-radius: 20px;
  background: var(--bg-panel);
  backdrop-filter: blur(20px);
  overflow: hidden;
  transform-style: preserve-3d;
  transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
}

.group:hover {
  background: rgba(22, 14, 42, 0.6);
}

.group-head h2 {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-main);
}

.group-head .sub {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.4;
}

.people {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
  padding: 16px;
}

.person {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(255, 255, 255, 0.03);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.01);
  transform-style: preserve-3d;
  transition: background 0.25s, border-color 0.25s;
}

.person:hover {
  background: rgba(124, 58, 237, 0.08);
}

.avatar {
  flex: 0 0 40px;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  font-size: 19px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  color: var(--text-main);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

.person-info {
  min-width: 0;
  flex: 1;
}

.person-name {
  font-weight: 700;
  font-size: 15px;
  overflow-wrap: anywhere;
  line-height: 1.3;
}

.person-role {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.3;
}

@media (max-width: 1400px) {
  .layout-grid {
    grid-template-columns: 1fr;
  }
  .sidebar, .sidebar-secondary {
    height: auto;
    position: relative;
    border-right: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  }
}

#node-batya:hover, #node-batya.couple-highlight {
  border-color: #60a5fa !important;
  box-shadow: 0 0 25px rgba(96, 165, 250, 0.85) !important;
}
#node-shmel:hover, #node-shmel.couple-highlight {
  border-color: #fbbf24 !important;
  box-shadow: 0 0 25px rgba(251, 191, 36, 0.85) !important;
}
#node-priest:hover, #node-priest.couple-highlight {
  border-color: #f59e0b !important;
  box-shadow: 0 0 25px rgba(245, 158, 11, 0.85) !important;
}
#node-femboy:hover, #node-femboy.couple-highlight {
  border-color: #f472b6 !important;
  box-shadow: 0 0 25px rgba(244, 114, 182, 0.85) !important;
}
#node-police:hover, #node-police.couple-highlight {
  border-color: #2563eb !important;
  box-shadow: 0 0 25px rgba(37, 99, 235, 0.85) !important;
}
</style>
</head>
<body>
<canvas id="tree-canvas"></canvas>

<button class="perf-toggle" id="perf-btn" onclick="toggleEcoMode()">⚡ Эко-режим: Выкл</button>

<main class="layout-grid">
  <aside class="sidebar">
    <div class="search-container">
      <input type="text" id="family-search" class="search-input" placeholder="🔍 Найти человека...">
    </div>
    <div id="sidebar"></div>
  </aside>
  
  <aside class="sidebar-secondary" id="sidebar-secondary"></aside>

  <div class="main-content">
    <header class="hero">
      <div class="eyebrow" id="eyebrow">Загрузка...</div>
      <h1 id="title">Семейное древо</h1>
      <p class="subtitle" id="subtitle"></p>
      <div class="status" id="status" onclick="loadFamily()"><span class="dot"></span>Загружаю family.json...</div>
    </header>

    <section id="content"></section>
    <footer class="final-quote" id="footer"></footer>
  </div>
</main>

<script>
var JSON_FILE = "./family.json";
var REFRESH_MS = 30000;
var lastJSON = "";
var ecoMode = false;

function esc(v) {
  v = v || "";
  v = String(v);
  return v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"'");
}
function levelLabelText(level) {
  var labels = {
    0: "Старшее поколение",
    1: "Родители",
    2: "Дети своих родителей",
    3: "Мои Дети",
    4: "Племянники и племянницы"
  };
  return labels[level] || ("Уровень " + level);
}

function renderGroup(group, tagClass, showGenTag) {
  var h = "";
  h += '<article class="group">';
  h += '<div class="group-head" onclick="toggleCollapse(this.parentNode)">';
  h += '<h2>' + esc(group.title) + '</h2>';
  h += '<div class="sub">' + esc(group.subtitle || "") + '</div>';
  h += '</div>';
  h += '<div class="people">';
  var ppl = group.people || [];
  for (var i = 0; i < ppl.length; i++) {
    var p = ppl[i];
    var pId = p.id ? ' id="node-' + esc(p.id) + '"' : '';
    h += '<div class="person"' + pId + ' data-name="' + esc(p.name).toLowerCase() + '" data-role="' + esc(p.role || "").toLowerCase() + '">';
    h += '<div class="avatar">' + esc(p.icon || "\uD83D\uDC9C") + '</div>';
    h += '<div class="person-info">';
    h += '<div class="person-name">' + esc(p.name) + '</div>';
    h += '<div class="person-role">' + esc(p.role || "") + '</div>';
    h += '</div>';
    h += '</div>';
  }
  h += '</div>';
  h += '</article>';
  return h;
}

function renderCenter(center) {
  var cId = center.id ? ' id="node-' + esc(center.id) + '"' : ' id="node-shaman"';
  var h = '<div class="center-card"' + cId + ' data-name="' + esc(center.name || "").toLowerCase() + '">';
  h += '<div class="icon">' + esc(center.icon || "\uD83D\uDC9C") + '</div>';
  h += '<span class="name">' + esc(center.name || "Я") + '</span>';
  h += '<span class="role">' + esc(center.role || "") + '</span>';
  h += '</div>';
  return h;
}

function populateSidebar(elementId, dataArray) {
  var h = "";
  for (var i = 0; i < dataArray.length; i++) {
    var section = dataArray[i];
    h += '<div class="section-block">';
    h += '<div class="section-title" onclick="toggleCollapse(this.parentNode)">' + esc(section.title || "") + '</div>';
    h += '<p class="section-desc">' + esc(section.subtitle || "") + '</p>';
    h += '<div class="card-list">';
    var ppl = section.people || [];
    for (var j = 0; j < ppl.length; j++) {
      var p = ppl[j];
      var pId = p.id ? ' id="node-' + esc(p.id) + '"' : '';
      h += '<div class="sidebar-card"' + pId + ' data-name="' + esc(p.name).toLowerCase() + '" data-role="' + esc(p.role || "").toLowerCase() + '">';
      h += '<div class="avatar-small">' + esc(p.icon || "\uD83D\uDC9C") + '</div>';
      h += '<div class="info-small">';
      h += '<h4>' + esc(p.name) + '</h4>';
      h += '<p>' + esc(p.role || "") + '</p>';
      h += '</div>';
      h += '</div>';
    }
    h += '</div>';
    h += '</div>';
  }
  document.getElementById(elementId).innerHTML = h;
}

function toggleCollapse(element) {
  element.classList.toggle('collapsed');
  if (!ecoMode) setTimeout(drawLasers, 100);
}

function toggleEcoMode() {
  ecoMode = !ecoMode;
  var btn = document.getElementById('perf-btn');
  var canvas = document.getElementById('tree-canvas');
  
  if (ecoMode) {
    document.body.classList.add('eco-mode');
    btn.classList.add('active');
    btn.textContent = '⚡ Эко-режим: Вкл';
    if (canvas) {
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  } else {
    document.body.classList.remove('eco-mode');
    btn.classList.remove('active');
    btn.textContent = '⚡ Эко-режим: Выкл';
    drawLasers();
  }
}

function initAnimatedBg() {
  document.addEventListener('mousemove', function(e) {
    if (ecoMode) return;
    var x = (e.clientX / window.innerWidth) * 100;
    var y = (e.clientY / window.innerHeight) * 100;
    document.body.style.setProperty('--bg-x1', (15 + (x - 50) * 0.1) + '%');
    document.body.style.setProperty('--bg-y1', (20 + (y - 50) * 0.1) + '%');
    document.body.style.setProperty('--bg-x2', (85 + (x - 50) * 0.08) + '%');
    document.body.style.setProperty('--bg-y2', (15 + (y - 50) * 0.08) + '%');
  });
}

function init3DTilt() {
  var cards = document.querySelectorAll('.person, .sidebar-card, .center-card');
  cards.forEach(function(card) {
    card.addEventListener('mousemove', function(e) {
      if (ecoMode) return;
      var rect = this.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      var xc = rect.width / 2;
      var yc = rect.height / 2;
      var angleX = (yc - y) / 10;
      var angleY = (x - xc) / 10;
      
      this.style.transform = "perspective(600px) rotateX(" + angleX + "deg) rotateY(" + angleY + "deg) translateZ(15px)";
      
      if (this.id === 'node-batya' || this.id === 'node-shmel' || this.id === 'node-priest' || this.id === 'node-femboy' || this.id === 'node-police') {
        return; 
      }
      
      var isHighlighted = this.classList.contains('couple-highlight');
      var borderGlow = isHighlighted ? "var(--glow-couple)" : "var(--glow)";
      var borderColor = isHighlighted ? "var(--accent-2)" : "rgba(124, 58, 237, 0.4)";
      
      this.style.borderColor = borderColor;
      this.style.boxShadow = "0 20px 40px rgba(0,0,0,0.5), " + borderGlow;
    });
    
    card.addEventListener('mouseleave', function() {
      this.style.transform = "perspective(600px) rotateX(0deg) rotateY(0deg) translateZ(0px)";
      this.style.borderColor = "";
      this.style.boxShadow = "";
    });
  });
}

var activeConnections = [];

function drawLasers() {
  var canvas = document.getElementById('tree-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  
  if (ecoMode) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }
  
  canvas.width = document.documentElement.scrollWidth;
  canvas.height = document.documentElement.scrollHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  activeConnections.forEach(function(conn) {
    var fromEl = document.getElementById('node-' + conn.from);
    var toEl = document.getElementById('node-' + conn.to);
    
    if (fromEl && toEl) {
      if (fromEl.classList.contains('is-hidden') || toEl.classList.contains('is-hidden')) return;
      
      var rFrom = fromEl.getBoundingClientRect();
      var rTo = toEl.getBoundingClientRect();
      
      var x1 = rFrom.left + rFrom.width / 2 + window.scrollX;
      var y1 = rFrom.top + rFrom.height / 2 + window.scrollY;
      var x2 = rTo.left + rTo.width / 2 + window.scrollX;
      var y2 = rTo.top + rTo.height / 2 + window.scrollY;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      
      var isHighlighted = fromEl.classList.contains('couple-highlight') && toEl.classList.contains('couple-highlight');
      
      if (isHighlighted) {
        if (fromEl.id === 'node-batya' || toEl.id === 'node-batya') ctx.strokeStyle = '#60a5fa';
        else if (fromEl.id === 'node-shmel' || toEl.id === 'node-shmel') ctx.strokeStyle = '#fbbf24';
        else ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = ctx.strokeStyle;
      } else {
        ctx.strokeStyle = conn.color ? conn.color : 'rgba(124, 58, 237, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 0;
      }
      
      ctx.stroke();
    }
  });
}
function initCoupleHighlights() {
  var grid = document.querySelector('.layout-grid');
  var observer = new MutationObserver(function() {
    var peopleCards = document.querySelectorAll('.person, .sidebar-card, .center-card');
    
    peopleCards.forEach(function(card) {
      if (card.getAttribute('data-has-highlights')) return;
      card.setAttribute('data-has-highlights', 'true');

      card.addEventListener('mouseenter', function() {
        var selfId = this.id ? this.id.replace('node-', '') : '';
        if (!selfId) return;

        // Собираем лазерные связи родственников из JSON
        var connectedIds = [selfId];
        activeConnections.forEach(function(conn) {
          if (conn.from === selfId) connectedIds.push(conn.to);
          if (conn.to === selfId) connectedIds.push(conn.from);
        });

        // ЖЕЛЕЗОБЕТОННАЯ СВЯЗЬ ПАРЫ ПО ID ИЗ JSON (doch1 + zyat1)
        var isCoupleTarget = (selfId === 'doch1' || selfId === 'zyat1');
        if (isCoupleTarget) {
          if (connectedIds.indexOf('doch1') === -1) connectedIds.push('doch1');
          if (connectedIds.indexOf('zyat1') === -1) connectedIds.push('zyat1');
        }

        // Включаем режим фокуса (приглушаем весь сайт)
        if (grid) grid.classList.add('tree-dimmed');
        
        var allCards = document.querySelectorAll('.person, .sidebar-card, .center-card');
        allCards.forEach(function(otherCard) {
          var otherId = otherCard.id ? otherCard.id.replace('node-', '') : '';
          
          if (otherId && connectedIds.indexOf(otherId) !== -1) {
            otherCard.classList.add('couple-highlight');
          } else {
            otherCard.classList.remove('couple-highlight');
          }
        });
        if (!ecoMode) drawLasers();
      });

      card.addEventListener('mouseleave', function() {
        if (grid) grid.classList.remove('tree-dimmed');
        var allCards = document.querySelectorAll('.person, .sidebar-card, .center-card');
        allCards.forEach(function(otherCard) {
          otherCard.classList.remove('couple-highlight');
        });
        if (!ecoMode) drawLasers();
      });
    });
  });

  observer.observe(document.body, { childList: true, subtree: true });
}

function initSearch() {
  var searchInput = document.getElementById('family-search');
  if (!searchInput) return;

  searchInput.addEventListener('input', function() {
    var query = this.value.toLowerCase().trim();
    var people = document.querySelectorAll('.person, .sidebar-card, .center-card');
    var groups = document.querySelectorAll('.group, .section-block');
    var levels = document.querySelectorAll('.level-row');

    if (query === '') {
      people.forEach(function(p) { p.classList.remove('is-hidden'); });
      groups.forEach(function(g) { g.classList.remove('is-hidden'); });
      levels.forEach(function(l) { l.classList.remove('is-hidden'); });
      if (!ecoMode) setTimeout(drawLasers, 50);
      return;
    }

    people.forEach(function(p) {
      var name = p.getAttribute('data-name') || '';
      var role = p.getAttribute('data-role') || '';
      if (name.includes(query) || role.includes(query)) {
        p.classList.remove('is-hidden');
      } else {
        p.classList.add('is-hidden');
      }
    });

    groups.forEach(function(g) {
      var visiblePeople = g.querySelectorAll('.person:not(.is-hidden), .sidebar-card:not(.is-hidden)');
      if (visiblePeople.length === 0) {
        g.classList.add('is-hidden');
      } else {
        g.classList.remove('is-hidden');
      }
    });

    levels.forEach(function(l) {
      var visibleGroups = l.querySelectorAll('.group:not(.is-hidden), .center-card:not(.is-hidden)');
      if (visibleGroups.length === 0) {
        l.classList.add('is-hidden');
      } else {
        l.classList.remove('is-hidden');
      }
    });
    
    if (!ecoMode) setTimeout(drawLasers, 50);
  });
}

function render(data) {
  document.title = data.title || "Семейное древо";
  document.getElementById("eyebrow").textContent = data.eyebrow || "";
  document.getElementById("title").textContent = data.title || "Семейное древо";
  document.getElementById("subtitle").textContent = data.subtitle || "";
  document.getElementById("footer").innerHTML = (data.footer || "").replace(/\uD83D\uDC9C/g, '<span class="heart">\uD83D\uDC9C</span>');

  var center = data.center || {};
  var centerLevel = (center.level !== undefined) ? center.level : 2;
  var groups = Array.isArray(data.groups) ? data.groups : [];
  
  var closePeople = Array.isArray(data.closePeople) ? data.closePeople : [];
  var secondaryPeople = Array.isArray(data.secondaryPeople) ? data.secondaryPeople : [];
  
  activeConnections = Array.isArray(data.connections) ? data.connections : [];

  populateSidebar("sidebar", closePeople);
  populateSidebar("sidebar-secondary", secondaryPeople);

  var levels = {};
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    var lv = (g.level !== undefined) ? g.level : 0;
    if (!levels[lv]) levels[lv] = [];
    levels[lv].push(g);
  }
  if (!levels[centerLevel]) levels[centerLevel] = [];
  levels[centerLevel]._hasCenter = true;

  var sortedLevels = Object.keys(levels).sort(function(a,b){return Number(a)-Number(b)});

  var html = '<div class="tree">';
  for (var idx = 0; idx < sortedLevels.length; idx++) {
    var lv = sortedLevels[idx];
    var levelNum = Number(lv);
    if (idx > 0) {
      html += '<div class="connector"><div class="vline"></div></div>';
    }
    html += '<div class="level-row">';
    html += '<div class="level-label">' + esc(levelLabelText(levelNum)) + '</div>';
    if (levels[lv]._hasCenter) {
      html += renderCenter(center);
    }
    var lvGroups = levels[lv];
    for (var j = 0; j < lvGroups.length; j++) {
      var g = lvGroups[j];
      var showGenTag = (g.level === centerLevel);
      html += renderGroup(g, String(levelNum), showGenTag);
    }
    html += '</div>';
  }
  html += '</div>';

  document.getElementById("content").innerHTML = html;

  initSearch();
  initAnimatedBg();
  init3DTilt();
  initCoupleHighlights();
  
  if (!ecoMode) setTimeout(drawLasers, 300);
}

function loadFamily() {
  var status = document.getElementById("status");
  status.innerHTML = '<span class="dot"></span>Загружаю...';
  fetch(JSON_FILE + "?v=" + Date.now(), {cache: "no-store"})
    .then(function(resp) {
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.text();
    })
    .then(function(text) {
      var data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("Ошибка JSON: " + e.message);
      }
      if (text !== lastJSON) {
        render(data);
        lastJSON = text;
        status.innerHTML = '<span class="dot"></span>Обновлено: ' + new Date().toLocaleTimeString("ru-RU");
      } else {
        status.innerHTML = '<span class="dot"></span>Проверено: ' + new Date().toLocaleTimeString("ru-RU");
      }
    })
    .catch(function(err) {
      status.innerHTML = '<span class="dot" style="background:#f87171"></span>Ошибка: ' + err.message;
      if (!lastJSON) {
        document.getElementById("content").innerHTML = '<div class="error-box">Ошибка загрузки family.json. Проверь: 1) файл лежит в корне репозитория; 2) в JSON нет ошибок синтаксиса; 3) открой консоль (F12).</div>';
      }
      console.error(err);
    });
}

window.addEventListener('resize', function() { if (!ecoMode) drawLasers(); });
window.addEventListener('scroll', function() { if (!ecoMode) drawLasers(); });

loadFamily();
setInterval(loadFamily, REFRESH_MS);
</script>
