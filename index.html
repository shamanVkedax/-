<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейное древо — Хроники Экосистемы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💚</text></svg>">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #030605;
  --bg-panel: rgba(9, 15, 13, 0.85);
  --accent-1: #10b981;
  --accent-2: #ec4899;
  --accent-3: #64748b;
  --text-main: #f1f5f2;
  --text-muted: #8fa399;
  --border-inner: rgba(16, 185, 129, 0.4);
  --border-outer: rgba(255, 255, 255, 0.03);
  --glow: 0 0 25px rgba(16, 185, 129, 0.2);
  --glow-partner: 0 0 30px rgba(236, 72, 153, 0.6);
  --line-grad: linear-gradient(to bottom, transparent, rgba(16, 185, 129, 0.35), transparent);
  --card-radius: 14px;
  --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  margin: 0;
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: #000;
  background-attachment: fixed;
  overflow-x: hidden;
  position: relative;
}

.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: -2;
  background-color: #030605;
  background-image: 
    radial-gradient(rgba(16, 185, 129, 0.06) 1px, transparent 0),
    radial-gradient(rgba(100, 116, 139, 0.02) 1px, transparent 0);
  background-size: 32px 32px;
  background-position: 0 0, 16px 16px;
  pointer-events: none;
}

.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(150px);
  opacity: 0.12;
  pointer-events: none;
  z-index: -2;
  animation: floatBlobs 28s infinite alternate ease-in-out;
}
.blob-1 { top: 15%; left: 8%; width: 550px; height: 550px; background: var(--accent-1); }
.blob-2 { bottom: 12%; right: 8%; width: 600px; height: 600px; background: #047857; animation-delay: -7s; }

@keyframes floatBlobs {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(50px, 30px) scale(1.15); }
}

.layout-grid {
  display: grid;
  grid-template-columns: minmax(280px, 320px) minmax(280px, 320px) 1fr;
  min-height: 100vh;
  max-width: 1920px;
  margin: 0 auto;
}
.sidebar, .sidebar-secondary {
  padding: 40px 20px;
  background: rgba(3, 8, 6, 0.65);
  border-right: 1px solid rgba(16, 185, 129, 0.05);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  overflow-y: auto;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.sidebar-secondary {
  background: rgba(3, 8, 6, 0.4);
  border-right: none;
  border-left: 1px solid rgba(16, 185, 129, 0.05);
}

.sidebar::-webkit-scrollbar, .sidebar-secondary::-webkit-scrollbar {
  width: 5px;
}
.sidebar::-webkit-scrollbar-track, .sidebar-secondary::-webkit-scrollbar-track {
  background: transparent;
}
.sidebar::-webkit-scrollbar-thumb, .sidebar-secondary::-webkit-scrollbar-thumb {
  background: rgba(16, 185, 129, 0);
  border-radius: 99px;
  transition: var(--transition-smooth);
}
.sidebar:hover::-webkit-scrollbar-thumb, .sidebar-secondary:hover::-webkit-scrollbar-thumb {
  background: rgba(16, 185, 129, 0.25);
}

.section-block {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.section-title {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent-1);
  display: flex;
  align-items: center;
  gap: 10px;
  text-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
}

.section-desc {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.4;
}

.card-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sidebar-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-outer);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: var(--transition-smooth);
}

.sidebar-card:hover {
  transform: translateX(4px);
  border-color: rgba(16, 185, 129, 0.3);
  box-shadow: var(--glow);
  background: rgba(12, 23, 19, 0.9);
}

.avatar-small {
  flex: 0 0 36px;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 18px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.04);
}

.info-small h4 {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
}

.info-small p {
  font-size: 11px;
  color: var(--text-muted);
}

.main-content {
  padding: 50px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.hero {
  text-align: center;
  margin-bottom: 40px;
  width: 100%;
}

.eyebrow {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(100, 116, 139, 0.15));
  border: 1px solid rgba(16, 185, 129, 0.25);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
}

h1 {
  margin: 14px 0 6px;
  font-size: clamp(28px, 4.5vw, 48px);
  line-height: 1.1;
  font-weight: 800;
  background: linear-gradient(135deg, #ffffff 40%, #c1dad0 75%, #a3e635 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 25px rgba(16, 185, 129, 0.1);
}

.subtitle {
  max-width: 600px;
  margin: 0 auto 16px;
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.6;
}

.search-container {
  width: 100%;
  max-width: 400px;
  margin: 0 auto 24px;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  background: rgba(9, 15, 13, 0.6);
  border: 1px solid rgba(16, 185, 129, 0.2);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: var(--transition-smooth);
  backdrop-filter: blur(10px);
}

.search-input:focus {
  border-color: var(--accent-1);
  box-shadow: var(--glow), inset 0 0 8px rgba(16, 185, 129, 0.1);
  background: rgba(9, 15, 13, 0.85);
}

.search-input::placeholder {
  color: rgba(143, 163, 153, 0.5);
}

.status {
  margin: 12px auto 0;
  width: fit-content;
  padding: 6px 14px;
  border-radius: 999px;
  color: #fff;
  background: rgba(16, 185, 129, 0.04);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  border: 1px solid rgba(16, 185, 129, 0.15);
  display: flex;
  align-items: center;
  gap: 8px;
}

.status .dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-1);
  box-shadow: 0 0 10px var(--accent-1);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.tree {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.level-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 24px;
  width: 100%;
  position: relative;
  margin-bottom: 32px;
  transition: var(--transition-smooth);
}

.level-label {
  width: 100%;
  text-align: center;
  margin-bottom: 12px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  opacity: 0.65;
}

.connector {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 10px 0;
  position: relative;
}

.connector .vline {
  width: 2px;
  height: 36px;
  background: var(--line-grad);
}

.center-card {
  min-width: min(290px, 100%);
  text-align: center;
  padding: 28px 20px;
  border-radius: 20px;
  border: 1px solid var(--border-inner);
  background: rgba(10, 22, 17, 0.9);
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45), var(--glow);
  position: relative;
  flex: 1 1 290px;
  max-width: 400px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: var(--transition-smooth);
}

.center-card:hover {
  transform: translateY(-4px);
  border-color: #34d399;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.55), 0 0 25px rgba(16, 185, 129, 0.45);
}

.center-card::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
  z-index: -1;
  opacity: 0.25;
}

.center-card .icon {
  font-size: 34px;
  line-height: 1;
  margin-bottom: 10px;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
}

.center-card .name {
  display: block;
  font-size: 24px;
  font-weight: 800;
  background: linear-gradient(135deg, #fff 0%, #bbf7d0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1.2;
}

.center-card .role {
  display: block;
  color: var(--accent-1);
  margin-top: 6px;
  font-size: 13px;
  font-weight: 600;
}

.group {
  flex: 1 1 290px;
  max-width: 400px;
  border: 1px solid var(--border-outer);
  border-radius: 18px;
  background: var(--bg-panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  overflow: hidden;
  transition: var(--transition-smooth);
}

.group:hover {
  transform: translateY(-4px);
  border-color: rgba(16, 185, 129, 0.15);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
}

.group-head {
  padding: 16px 18px 12px;
  border-bottom: 1px solid rgba(16, 185, 129, 0.04);
  background: rgba(255, 255, 255, 0.005);
}

.group-head h2 {
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
}

.group-head .sub {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.4;
}

.people {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px;
}

.person {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid rgba(255, 255, 255, 0.005);
  border-radius: var(--card-radius);
  background: rgba(255, 255, 255, 0.005);
  transition: var(--transition-smooth);
}

.person:hover {
  background: rgba(16, 185, 129, 0.06);
  border-color: rgba(16, 185, 129, 0.18);
  transform: translateX(4px);
}

.person.search-fade, .group.search-fade, .center-card.search-fade {
  opacity: 0.15;
  filter: blur(1px) grayscale(0.5);
  transform: scale(0.98);
}

.person.partner-highlighted {
  background: rgba(236, 72, 153, 0.12) !important;
  border-color: rgba(236, 72, 153, 0.6) !important;
  box-shadow: var(--glow-partner) !important;
  transform: scale(1.03) translateY(-1px) !important;
  opacity: 1 !important;
  filter: none !important;
}

.avatar {
  flex: 0 0 38px;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  font-size: 18px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.04);
}

.person-info {
  min-width: 0;
  flex: 1;
}

.person-name {
  font-weight: 600;
  font-size: 14px;
  overflow-wrap: anywhere;
  line-height: 1.3;
  color: #fff;
}

.person-role {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 12px;
}

.final-quote {
  margin-top: 60px;
  text-align: center;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.6;
  max-width: 600px;
}

.emerald-heart {
  color: var(--accent-1);
  display: inline-block;
}

@media (max-width: 1400px) {
  .layout-grid {
    grid-template-columns: 280px 280px 1fr;
  }
}

@media (max-width: 1200px) {
  .layout-grid {
    grid-template-columns: 1fr;
  }
  .sidebar, .sidebar-secondary {
    height: auto;
    position: relative;
    border: none;
    border-bottom: 1px solid rgba(16, 185, 129, 0.04);
    padding: 30px 20px;
  }
  .main-content {
    padding: 40px 20px;
  }
}
</style>
</head>
<body>

<!-- Динамический кибер-изумрудный фон -->
<div class="bg-canvas">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<main class="layout-grid">
  <!-- Левый сайдбар: Близкий круг и Питомцы -->
  <aside class="sidebar" id="sidebar"></aside>
  
  <!-- Правый сайдбар: Инфраструктура и Окружение -->
  <aside class="sidebar-secondary" id="sidebar-secondary"></aside>

  <!-- Центральная область с интерактивным древом -->
  <div class="main-content">
    <header class="hero">
      <div class="eyebrow" id="eyebrow">Инициализация...</div>
      <h1 id="title">Семейное древо</h1>
      <p class="subtitle" id="subtitle"></p>
      
      <!-- Интерактивная строка поиска по древу -->
      <div class="search-container">
        <input type="text" id="tree-search" class="search-input" placeholder="Поиск по имени или роли...">
      </div>

      <!-- Умный статус-бар с динамической живой статистикой -->
      <div class="status" id="status"><span class="dot"></span>Анализ семейной базы данных...</div>
    </header>

    <!-- Сюда JavaScript выведет сгруппированные поколения -->
    <section id="content"></section>
    
    <!-- Хроники хронологии -->
    <footer class="final-quote" id="footer"></footer>
  </div>
</main>
<script>
var JSON_FILE = "family.json";
var REFRESH_MS = 30000;
var lastJSON = "";

// Функция безопасного экранирования спецсимволов (Защита от XSS-уязвимостей)
function esc(v) {
  if (!v) return "";
  return String(v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function levelLabelText(level) {
  var labels = {0: "Старшее поколение", 1: "Родители", 2: "Дети своих родителей", 4: "Племянники и племянницы", 3: "Мои Дети"};
  return labels[level] || ("Уровень " + level);
}

function renderGroup(group, tagClass, showGenTag) {
  var h = "";
  h += '<article class="group" data-search-block="true">';
  h += '<div class="group-head">';
  h += '<h2>' + esc(group.title) + '</h2>';
  h += '<div class="sub">' + esc(group.subtitle || "") + '</div>';
  h += '</div>';
  h += '<div class="people">';
  var ppl = group.people || [];
  for (var i = 0; i < ppl.length; i++) {
    var p = ppl[i];
    h += '<div class="person" data-name="' + esc(p.name) + '" data-role="' + esc(p.role) + '">';
    h += '<div class="avatar">' + esc(p.icon || "💚") + '</div>';
    h += '<div class="person-info">';
    h += '<div class="person-name">' + esc(p.name) + '</div>';
    h += '<div class="person-role">' + esc(p.role || "") + '</div>';
    h += '</div>';
    h += '</div>';
  }
  h += '</div>';
  h += '</article>';
  return h;
}

function renderCenter(center) {
  var h = '<div class="center-card" data-search-block="true" data-name="' + esc(center.name) + '" data-role="' + esc(center.role) + '">';
  h += '<div class="icon">' + esc(center.icon || "💚") + '</div>';
  h += '<span class="name">' + esc(center.name || "Я") + '</span>';
  h += '<span class="role">' + esc(center.role || "") + '</span>';
  h += '</div>';
  return h;
}

function populateSidebar(elementId, dataArray) {
  var h = "";
  for (var i = 0; i < dataArray.length; i++) {
    var section = dataArray[i];
    h += '<div class="section-block">';
    h += '<div class="section-title">' + esc(section.title || "") + '</div>';
    h += '<p class="section-desc">' + esc(section.subtitle || "") + '</p>';
    h += '<div class="card-list">';
    var ppl = section.people || [];
    for (var j = 0; j < ppl.length; j++) {
      var p = ppl[j];
      h += '<div class="sidebar-card" data-search-block="true" data-name="' + esc(p.name) + '" data-role="' + esc(p.role) + '">';
      h += '<div class="avatar-small">' + esc(p.icon || "💚") + '</div>';
      h += '<div class="info-small">';
      h += '<h4>' + esc(p.name) + '</h4>';
      h += '<p>' + esc(p.role || "") + '</p>';
      h += '</div>';
      h += '</div>';
    }
    h += '</div>';
    h += '</div>';
  }
  document.getElementById(elementId).innerHTML = h;
}

function getPartnerName(name) {
  var pairs = {
    "Diamonita Grand": "EKSOD_GRAND",
    "EKSOD_GRAND": "Diamonita Grand"
  };
  return pairs[name] || null;
}

function calculateStats(data) {
  var totalPeople = 0;
  var totalPets = 0;

  if (data.center) totalPeople++;
  if (Array.isArray(data.groups)) {
    data.groups.forEach(function(g) {
      if (Array.isArray(g.people)) totalPeople += g.people.length;
    });
  }
  if (Array.isArray(data.closePeople)) {
    data.closePeople.forEach(function(s) {
      if (s.title && (s.title.indexOf("питомцы") !== -1 || s.title.indexOf("🐾") !== -1)) {
        if (Array.isArray(s.people)) totalPets += s.people.length;
      } else {
        if (Array.isArray(s.people)) totalPeople += s.people.length;
      }
    });
  }
  if (Array.isArray(data.secondaryPeople)) {
    data.secondaryPeople.forEach(function(s) {
      if (Array.isArray(s.people)) totalPeople += s.people.length;
    });
  }
  return { people: totalPeople, pets: totalPets };
}
function render(data) {
  document.title = data.title || "Семейное древо";
  document.getElementById("eyebrow").textContent = data.eyebrow || "";
  document.getElementById("title").textContent = data.title || "Семейное древо";
  document.getElementById("subtitle").textContent = data.subtitle || "";
  document.getElementById("footer").innerHTML = (data.footer || "").replace(/💜/g, '<span class="emerald-heart">💚</span>');

  var center = data.center || {};
  var centerLevel = (center.level !== undefined) ? center.level : 2;
  var groups = Array.isArray(data.groups) ? data.groups : [];
  
  var closePeople = Array.isArray(data.closePeople) ? data.closePeople : [];
  var secondaryPeople = Array.isArray(data.secondaryPeople) ? data.secondaryPeople : [];

  populateSidebar("sidebar", closePeople);
  populateSidebar("sidebar-secondary", secondaryPeople);

  var levels = {};
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    var lv = (g.level !== undefined) ? g.level : 0;
    if (!levels[lv]) levels[lv] = [];
    levels[lv].push(g);
  }
  if (!levels[centerLevel]) levels[centerLevel] = [];
  levels[centerLevel]._hasCenter = true;

  var sortedLevels = Object.keys(levels).sort(function(a,b){return Number(a)-Number(b)});

  var html = '<div class="tree">';
  for (var idx = 0; idx < sortedLevels.length; idx++) {
    var lv = sortedLevels[idx];
    var levelNum = Number(lv);
    if (idx > 0) {
      html += '<div class="connector"><div class="vline"></div></div>';
    }
    html += '<div class="level-row">';
    html += '<div class="level-label">' + esc(levelLabelText(levelNum)) + '</div>';
    if (levels[lv]._hasCenter) {
      html += renderCenter(center);
    }
    var lvGroups = levels[lv];
    for (var j = 0; j < lvGroups.length; j++) {
      var g = lvGroups[j];
      var showGenTag = (g.level === centerLevel);
      html += renderGroup(g, String(levelNum), showGenTag);
    }
    html += '</div>';
  }
  html += '</div>';

  document.getElementById("content").innerHTML = html;
  applySearchFilter();
}

function loadFamily() {
  var status = document.getElementById("status");
  fetch(JSON_FILE + "?v=" + Date.now(), {cache: "no-store"})
    .then(function(resp) {
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.text();
    })
    .then(function(text) {
      var data;
      try { data = JSON.parse(text); } catch (e) { throw new Error("Ошибка JSON: " + e.message); }
      
      if (text !== lastJSON) {
        render(data);
        lastJSON = text;
      }
      var stats = calculateStats(data);
      status.innerHTML = '<span class="dot"></span>Экосистема активна | Родных: ' + stats.people + ' | Хвостиков: ' + stats.pets + ' | ' + new Date().toLocaleTimeString("ru-RU");
    })
    .catch(function(err) {
      status.innerHTML = '<span class="dot" style="background:#f87171; box-shadow: 0 0 10px #f87171;"></span>Сбой: ' + err.message;
      if (!lastJSON) {
        document.getElementById("content").innerHTML = '<div class="error-box">Ошибка загрузки family.json. Проверь: 1) файл лежит в корне репозитория; 2) в JSON нет синтаксических ошибок.</div>';
      }
      console.error(err);
    });
}

function applySearchFilter() {
  var query = document.getElementById("tree-search").value.toLowerCase().trim();
  var peopleCards = document.querySelectorAll('.person');
  var groupArticles = document.querySelectorAll('.group');
  var centerCard = document.querySelector('.center-card');
  var sidebarCards = document.querySelectorAll('.sidebar-card');

  if (!query) {
    var items = document.querySelectorAll('.search-fade');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('search-fade');
    return;
  }

  if (centerCard) {
    var cName = (centerCard.getAttribute('data-name') || '').toLowerCase();
    var cRole = (centerCard.getAttribute('data-role') || '').toLowerCase();
    if (cName.indexOf(query) !== -1 || cRole.indexOf(query) !== -1) {
      centerCard.classList.remove('search-fade');
    } else {
      centerCard.classList.add('search-fade');
    }
  }

  for (var i = 0; i < sidebarCards.length; i++) {
    var card = sidebarCards[i];
    var sName = (card.getAttribute('data-name') || '').toLowerCase();
    var sRole = (card.getAttribute('data-role') || '').toLowerCase();
    if (sName.indexOf(query) !== -1 || sRole.indexOf(query) !== -1) {
      card.classList.remove('search-fade');
    } else {
      card.classList.add('search-fade');
    }
  }

  for (var i = 0; i < groupArticles.length; i++) {
    var group = groupArticles[i];
    var innerPeople = group.querySelectorAll('.person');
    var groupHasMatch = false;

    for (var j = 0; j < innerPeople.length; j++) {
      var person = innerPeople[j];
      var pName = (person.getAttribute('data-name') || '').toLowerCase();
      var pRole = (person.getAttribute('data-role') || '').toLowerCase();

      if (pName.indexOf(query) !== -1 || pRole.indexOf(query) !== -1) {
        person.classList.remove('search-fade');
        groupHasMatch = true;
      } else {
        person.classList.add('search-fade');
      }
    }

    if (groupHasMatch) {
      group.classList.remove('search-fade');
    } else {
      group.classList.add('search-fade');
    }
  }
}

document.getElementById('tree-search').addEventListener('input', applySearchFilter);

loadFamily();
setInterval(loadFamily, REFRESH_MS);

document.addEventListener('mouseover', function(e) {
  var personCard = e.target.closest('.person');
  if (!personCard) return;

  var name = personCard.getAttribute('data-name');
  var partnerName = getPartnerName(name);

  if (partnerName) {
    var partnerCard = document.querySelector('.person[data-name="' + partnerName + '"]');
    personCard.classList.add('partner-highlighted');
    if (partnerCard) {
      partnerCard.classList.add('partner-highlighted');
    }
  }
});

document.addEventListener('mouseout', function(e) {
  var personCard = e.target.closest('.person');
  if (!personCard) return;

  var name = personCard.getAttribute('data-name');
  var partnerName = getPartnerName(name);

  if (partnerName) {
    var partnerCard = document.querySelector('.person[data-name="' + partnerName + '"]');
    personCard.classList.remove('partner-highlighted');
    if (partnerCard) {
      partnerCard.classList.remove('partner-highlighted');
    }
  }
});
</script>
